<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Calories — Suivi fitness</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg: #12161B;
    --surface: #1B2128;
    --surface-2: #222A32;
    --text: #F2F0EA;
    --text-muted: #8A93A0;
    --line: #2A323B;

    --lime: #D4F252;
    --lime-dim: #3A4420;
    --flame: #FF7A59;
    --flame-dim: #3D2620;
    --volt: #6FA8FF;
    --volt-dim: #202B3D;
    --grape: #C892FF;
    --grape-dim: #2E2440;
  }

  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0;
    background:#0A0C0F;
    font-family:'Inter', sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  body{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding: 32px 12px;
  }

  .device{
    width: 390px; height: 844px;
    background: var(--bg);
    border-radius: 44px;
    border: 1px solid #262d35;
    box-shadow: 0 40px 80px -20px rgba(0,0,0,0.6), 0 0 0 8px #05070a;
    overflow: hidden;
    position: relative;
    display:flex; flex-direction: column;
  }

  .statusbar{
    display:flex; justify-content:space-between; align-items:center;
    padding: 18px 28px 6px;
    font-size: 14px; font-weight:600; color: var(--text);
    flex-shrink:0;
  }
  .statusbar .dots{ display:flex; gap:5px; align-items:center; }
  .statusbar .dots span{ width:4px; height:4px; border-radius:50%; background: var(--text); display:inline-block; }

  .content{
    flex:1; overflow-y:auto; padding: 4px 24px 130px;
  }
  .content::-webkit-scrollbar{ display:none; }

  /* header */
  .page-header{
    display:flex; align-items:center; justify-content:space-between;
    margin: 12px 0 18px;
  }
  .page-title{ font-family:'Unbounded'; font-weight:700; font-size:22px; }
  .page-header .date{ font-size:12px; color:var(--text-muted); margin-top:2px; }
  .goal-btn{
    width:38px; height:38px; border-radius:13px;
    background: var(--surface); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
  }

  /* grand anneau calories */
  .ring-card{
    background: linear-gradient(165deg, var(--surface) 0%, #171C22 100%);
    border: 1px solid var(--line);
    border-radius: 28px;
    padding: 26px 20px;
    display:flex; flex-direction:column; align-items:center;
    margin-bottom: 18px;
  }
  .big-ring{ position:relative; width:180px; height:180px; margin-bottom:14px; }
  .big-ring svg{ transform: rotate(-90deg); }
  .big-ring .bg{ fill:none; stroke:#2A323B; stroke-width:14; }
  .big-ring .fg{
    fill:none; stroke: var(--flame); stroke-width:14; stroke-linecap:round;
    stroke-dasharray: 502; stroke-dashoffset: 178;
    filter: drop-shadow(0 0 8px rgba(255,122,89,0.4));
  }
  .big-ring-center{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
  }
  .big-ring-center .num{ font-family:'Unbounded'; font-weight:800; font-size:30px; }
  .big-ring-center .lbl{ font-size:11.5px; color:var(--text-muted); margin-top:4px; text-align:center; }

  .ring-footer{ display:flex; gap:26px; }
  .ring-footer .item{ text-align:center; }
  .ring-footer .item .v{ font-weight:700; font-size:14px; }
  .ring-footer .item .k{ font-size:10.5px; color:var(--text-muted); margin-top:2px; }
  .ring-footer .sep{ width:1px; background:var(--line); }

  /* macros */
  .section-title{
    font-size: 12px; letter-spacing:0.1em; text-transform:uppercase;
    color: var(--text-muted); font-weight:700; margin: 6px 0 12px;
  }
  .macro-row{ display:flex; gap:10px; margin-bottom:8px; }
  .macro-card{
    flex:1; background: var(--surface); border:1px solid var(--line);
    border-radius:18px; padding:14px 12px; text-align:center;
  }
  .macro-ring{ position:relative; width:52px; height:52px; margin:0 auto 8px; }
  .macro-ring svg{ transform: rotate(-90deg); }
  .macro-ring .bg{ fill:none; stroke:#2A323B; stroke-width:6; }
  .macro-ring .fg{ fill:none; stroke-width:6; stroke-linecap:round; }
  .macro-card.p .fg{ stroke: var(--volt); }
  .macro-card.g .fg{ stroke: var(--lime); }
  .macro-card.l .fg{ stroke: var(--grape); }
  .macro-ring .val{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:700;
  }
  .macro-name{ font-size:11.5px; color:var(--text-muted); }
  .macro-amt{ font-size:12.5px; font-weight:600; margin-top:1px; }

  /* repas */
  .meal-group{ margin-bottom: 6px; }
  .meal-group-header{
    display:flex; align-items:center; justify-content:space-between;
    margin: 18px 0 10px;
  }
  .meal-group-title{ font-weight:700; font-size:14.5px; }
  .meal-group-kcal{ font-size:12px; color:var(--text-muted); }

  .food-item{
    display:flex; align-items:center; gap:12px;
    background: var(--surface); border:1px solid var(--line);
    border-radius:18px; padding:12px 14px; margin-bottom:8px;
  }
  .food-icon{
    width:38px; height:38px; border-radius:12px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:18px;
  }
  .food-icon.a{ background: var(--flame-dim); }
  .food-icon.b{ background: var(--lime-dim); }
  .food-icon.c{ background: var(--grape-dim); }
  .food-meta{ flex:1; }
  .food-name{ font-weight:600; font-size:13.5px; }
  .food-detail{ font-size:11.5px; color:var(--text-muted); margin-top:2px; }
  .food-kcal{ font-weight:700; font-size:13.5px; color: var(--text); white-space:nowrap; }
  .food-delete{
    width:26px; height:26px; border-radius:8px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background: transparent; border:none; cursor:pointer;
    color: var(--text-muted);
  }
  .food-delete:hover{ color: var(--flame); background: var(--flame-dim); }

  .add-meal-btn{
    width:100%; border:1.5px dashed var(--line); border-radius:18px;
    background: transparent; color: var(--text-muted);
    padding: 13px; font-size:13px; font-weight:600;
    display:flex; align-items:center; justify-content:center; gap:8px;
    margin-top: 4px; font-family:'Inter';
  }

  /* bottom nav (identique) */
  .navbar{
    position:absolute; left:0; right:0; bottom:0; height:108px;
    background: linear-gradient(180deg, rgba(18,22,27,0) 0%, var(--bg) 30%);
    display:flex; align-items:flex-end; justify-content:center; padding-bottom:26px;
  }
  .nav-pill{
    width:300px; height:66px;
    background: rgba(27,33,40,0.9); backdrop-filter: blur(14px);
    border:1px solid var(--line); border-radius:33px;
    display:flex; align-items:center; justify-content:space-between;
    padding: 0 22px; position:relative;
  }
  .nav-item{
    display:flex; flex-direction:column; align-items:center; gap:4px;
    color: var(--text-muted); width:44px; position:relative;
  }
  .nav-item .lbl{ font-size:10px; font-weight:600; }
  .nav-item.cal{ color: var(--flame); }
  .nav-item.sport{ color: var(--volt); }
  .nav-item.active .chip{
    position:absolute; top:-8px; left:50%; transform:translateX(-50%);
    width:34px; height:34px; border-radius:11px; z-index:-1;
  }
  .nav-item.cal.active .chip{ background: var(--flame-dim); }

  .nav-home{
    position:absolute; left:50%; top:-26px; transform:translateX(-50%);
    width:64px; height:64px; border-radius:50%;
    background: var(--lime);
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 8px 24px rgba(212,242,82,0.2), 0 0 0 6px var(--bg);
  }
  .nav-item, .nav-home{ text-decoration:none; cursor:pointer; }
  .nav-home-label{
    position:absolute; left:50%; transform:translateX(-50%);
    top:40px; font-size:10px; font-weight:700; color: var(--text-muted);
    white-space:nowrap;
  }

  /* modale ajout d'aliment */
  .modal-overlay{
    position:absolute; inset:0; background:rgba(6,8,10,0.72);
    display:none; align-items:flex-end; z-index:50;
  }
  .modal-overlay.open{ display:flex; }
  .modal-sheet{
    width:100%; background: var(--bg); border-top:1px solid var(--line);
    border-radius: 28px 28px 0 0; padding: 22px 22px 28px; max-height:80%; overflow-y:auto;
  }
  .modal-title{ font-family:'Unbounded'; font-weight:700; font-size:17px; margin-bottom:16px; }
  .modal-field{ margin-bottom:12px; }
  .modal-field label{ display:block; font-size:11.5px; color:var(--text-muted); margin-bottom:6px; font-weight:600; }
  .modal-field input, .modal-field select{
    width:100%; background: var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:12px; font-size:13.5px; color:var(--text); font-family:'Inter';
  }
  .modal-row{ display:flex; gap:10px; }
  .modal-row .modal-field{ flex:1; }
  .modal-actions{ display:flex; gap:10px; margin-top:16px; }
  .modal-btn{
    flex:1; border:none; border-radius:14px; padding:13px; font-weight:700; font-size:13.5px; font-family:'Inter';
  }
  .modal-btn.cancel{ background: var(--surface); color: var(--text-muted); border:1px solid var(--line); }
  .modal-btn.save{ background: var(--lime); color:#12161B; }
</style>
</head>
<body>

<div class="device">

  <div class="statusbar">
    <span id="status-time">--:--</span>
    <div class="dots"><span></span><span></span><span></span></div>
  </div>

  <div class="content">
    <div class="page-header">
      <div>
        <div class="page-title">Calories</div>
        <div class="date" id="cal-date">—</div>
      </div>
      <div class="goal-btn" onclick="logout()" title="Se déconnecter" style="cursor:pointer;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8A93A0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      </div>
    </div>

    <div class="ring-card">
      <div class="big-ring">
        <svg width="180" height="180" viewBox="0 0 180 180">
          <circle class="bg" cx="90" cy="90" r="80"></circle>
          <circle class="fg" id="big-ring-fg" cx="90" cy="90" r="80"></circle>
        </svg>
        <div class="big-ring-center">
          <div class="num" id="remaining-num">—</div>
          <div class="lbl" id="remaining-lbl">kcal restantes</div>
        </div>
      </div>
      <div class="ring-footer">
        <div class="item">
          <div class="v" id="goal-v">—</div>
          <div class="k">Objectif</div>
        </div>
        <div class="sep"></div>
        <div class="item">
          <div class="v" id="consumed-v">—</div>
          <div class="k">Consommées</div>
        </div>
        <div class="sep"></div>
        <div class="item">
          <div class="v" id="burned-v">0</div>
          <div class="k">Brûlées</div>
        </div>
      </div>
    </div>

    <div class="section-title">Macronutriments</div>
    <div class="macro-row">
      <div class="macro-card p">
        <div class="macro-ring">
          <svg width="52" height="52" viewBox="0 0 52 52">
            <circle class="bg" cx="26" cy="26" r="21"></circle>
            <circle class="fg" id="protein-ring" cx="26" cy="26" r="21" stroke-dasharray="132" stroke-dashoffset="132"></circle>
          </svg>
          <div class="val" id="protein-pct">0%</div>
        </div>
        <div class="macro-name">Protéines</div>
        <div class="macro-amt" id="protein-amt">0 / 0 g</div>
      </div>
      <div class="macro-card g">
        <div class="macro-ring">
          <svg width="52" height="52" viewBox="0 0 52 52">
            <circle class="bg" cx="26" cy="26" r="21"></circle>
            <circle class="fg" id="carbs-ring" cx="26" cy="26" r="21" stroke-dasharray="132" stroke-dashoffset="132"></circle>
          </svg>
          <div class="val" id="carbs-pct">0%</div>
        </div>
        <div class="macro-name">Glucides</div>
        <div class="macro-amt" id="carbs-amt">0 / 0 g</div>
      </div>
      <div class="macro-card l">
        <div class="macro-ring">
          <svg width="52" height="52" viewBox="0 0 52 52">
            <circle class="bg" cx="26" cy="26" r="21"></circle>
            <circle class="fg" id="fat-ring" cx="26" cy="26" r="21" stroke-dasharray="132" stroke-dashoffset="132"></circle>
          </svg>
          <div class="val" id="fat-pct">0%</div>
        </div>
        <div class="macro-name">Lipides</div>
        <div class="macro-amt" id="fat-amt">0 / 0 g</div>
      </div>
    </div>

    <div id="meals-container"><div class="section-title">Chargement des repas…</div></div>

  </div>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-sheet">
      <div class="modal-title">Ajouter un aliment</div>
      <form onsubmit="submitMeal(event)">
        <div class="modal-field">
          <label>Nom de l'aliment</label>
          <input type="text" id="m-name" placeholder="Ex. Salade de poulet" required>
        </div>
        <div class="modal-row">
          <div class="modal-field">
            <label>Repas</label>
            <select id="m-type">
              <option value="petit-dejeuner">Petit-déjeuner</option>
              <option value="dejeuner">Déjeuner</option>
              <option value="diner">Dîner</option>
              <option value="collation">Collation</option>
            </select>
          </div>
          <div class="modal-field">
            <label>Calories (kcal)</label>
            <input type="number" id="m-cal" placeholder="350" min="0" required>
          </div>
        </div>
        <div class="modal-row">
          <div class="modal-field">
            <label>Protéines (g)</label>
            <input type="number" id="m-protein" placeholder="0" min="0" step="0.1">
          </div>
          <div class="modal-field">
            <label>Glucides (g)</label>
            <input type="number" id="m-carbs" placeholder="0" min="0" step="0.1">
          </div>
          <div class="modal-field">
            <label>Lipides (g)</label>
            <input type="number" id="m-fat" placeholder="0" min="0" step="0.1">
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="modal-btn cancel" onclick="closeModal()">Annuler</button>
          <button type="submit" class="modal-btn save">Ajouter</button>
        </div>
      </form>
    </div>
  </div>

  <div class="navbar">
    <div class="nav-pill">
      <a class="nav-item cal active" href="calories.html">
        <div class="chip"></div>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c1 3-2 4-2 7a4 4 0 0 0 8 0c0-1-.5-2-1-2 .5 2-1 3-2 2 1-2-1-3-1-5 0-1 .5-2 1-3-2 0-3.5 1-3 3-2 0-3 2-3 4a6 6 0 0 0 6 6"/></svg>
        <span class="lbl">Calories</span>
      </a>

      <div style="width:64px;"></div>

      <a class="nav-item sport" href="sport.html">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5 17.5 17.5M4 9l3-3 3 3-3 3-3-3zM17 12l3 3-3 3-3-3 3-3z"/></svg>
        <span class="lbl">Sport</span>
      </a>
    </div>

    <a class="nav-home" href="index.html">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#12161B" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
    </a>
    <div class="nav-home-label">Accueil</div>
  </div>

</div>

<script src="config.js"></script>
<script src="auth-guard.js"></script>
<script>
  const BIG_RING_CIRC = 502;   // 2 * PI * 80
  const MACRO_RING_CIRC = 132; // 2 * PI * 21

  const MEAL_GROUPS = [
    { key: "petit-dejeuner", label: "🌅 Petit-déjeuner" },
    { key: "dejeuner", label: "☀️ Déjeuner" },
    { key: "diner", label: "🌙 Dîner" },
    { key: "collation", label: "🍎 Collation" },
  ];

  function openModal(prefType){
    document.getElementById("modal-overlay").classList.add("open");
    if (prefType) document.getElementById("m-type").value = prefType;
  }
  function closeModal(){
    document.getElementById("modal-overlay").classList.remove("open");
    document.getElementById("m-name").value = "";
    document.getElementById("m-cal").value = "";
    document.getElementById("m-protein").value = "";
    document.getElementById("m-carbs").value = "";
    document.getElementById("m-fat").value = "";
  }

  async function submitMeal(e){
    e.preventDefault();
    const { error } = await supabaseClient.from("meals").insert({
      user_id: currentUser.id,
      name: document.getElementById("m-name").value.trim(),
      meal_type: document.getElementById("m-type").value,
      calories: parseInt(document.getElementById("m-cal").value) || 0,
      protein_g: parseFloat(document.getElementById("m-protein").value) || 0,
      carbs_g: parseFloat(document.getElementById("m-carbs").value) || 0,
      fat_g: parseFloat(document.getElementById("m-fat").value) || 0,
    });
    if (error){ alert("Erreur : " + error.message); return; }
    closeModal();
    loadCalories();
  }

  async function deleteMeal(mealId){
    if (!confirm("Supprimer cet aliment ?")) return;
    const { error } = await supabaseClient.from("meals").delete().eq("id", mealId);
    if (error){ alert("Erreur : " + error.message); return; }
    loadCalories();
  }

  function renderMeals(meals){
    const container = document.getElementById("meals-container");
    container.innerHTML = "";
    MEAL_GROUPS.forEach(group => {
      const items = meals.filter(m => m.meal_type === group.key);
      const totalKcal = items.reduce((s, m) => s + (m.calories || 0), 0);

      const groupEl = document.createElement("div");
      groupEl.className = "meal-group";

      const header = document.createElement("div");
      header.className = "meal-group-header";
      header.innerHTML = `<div class="meal-group-title">${group.label}</div><div class="meal-group-kcal">${items.length ? totalKcal.toLocaleString("fr-FR") + " kcal" : "Pas encore ajouté"}</div>`;
      groupEl.appendChild(header);

      items.forEach(m => {
        const time = new Date(m.logged_at).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
        const foodEl = document.createElement("div");
        foodEl.className = "food-item";
        foodEl.innerHTML = `
          <div class="food-icon a">🍽️</div>
          <div class="food-meta">
            <div class="food-name">${m.name}</div>
            <div class="food-detail">${time}</div>
          </div>
          <div class="food-kcal">${m.calories} kcal</div>
          <button class="food-delete" onclick="deleteMeal('${m.id}')" title="Supprimer">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>
          </button>`;
        groupEl.appendChild(foodEl);
      });

      const addBtn = document.createElement("button");
      addBtn.className = "add-meal-btn";
      addBtn.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg> Ajouter un aliment`;
      addBtn.onclick = () => openModal(group.key);
      groupEl.appendChild(addBtn);

      container.appendChild(groupEl);
    });
  }

  function setMacro(prefix, current, goal){
    const pct = goal > 0 ? Math.min(1, current / goal) : 0;
    document.getElementById(prefix + "-ring").style.strokeDashoffset = MACRO_RING_CIRC * (1 - pct);
    document.getElementById(prefix + "-pct").textContent = Math.round(pct * 100) + "%";
    document.getElementById(prefix + "-amt").textContent = `${Math.round(current)} / ${goal} g`;
  }

  async function loadCalories(){
    const user = await requireAuth();
    if (!user) return;

    document.getElementById("cal-date").textContent =
      new Date().toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });

    const { data: profile } = await supabaseClient
      .from("profiles").select("*").eq("id", user.id).single();
    const calorieGoal = profile?.calorie_goal ?? 2400;
    const proteinGoal = profile?.protein_goal_g ?? 120;
    const carbsGoal = profile?.carbs_goal_g ?? 160;
    const fatGoal = profile?.fat_goal_g ?? 70;

    const { data: meals } = await supabaseClient
      .from("meals").select("*")
      .eq("user_id", user.id)
      .gte("logged_at", startOfToday().toISOString())
      .lte("logged_at", endOfToday().toISOString())
      .order("logged_at", { ascending: true });

    const list = meals || [];
    const consumed = list.reduce((s, m) => s + (m.calories || 0), 0);
    const protein = list.reduce((s, m) => s + (Number(m.protein_g) || 0), 0);
    const carbs = list.reduce((s, m) => s + (Number(m.carbs_g) || 0), 0);
    const fat = list.reduce((s, m) => s + (Number(m.fat_g) || 0), 0);
    const remaining = Math.max(0, calorieGoal - consumed);

    document.getElementById("big-ring-fg").style.strokeDashoffset = BIG_RING_CIRC * (1 - Math.min(1, consumed / calorieGoal));
    document.getElementById("remaining-num").textContent = remaining.toLocaleString("fr-FR");
    document.getElementById("remaining-lbl").innerHTML = `kcal restantes<br>sur ${calorieGoal.toLocaleString("fr-FR")}`;
    document.getElementById("goal-v").textContent = calorieGoal.toLocaleString("fr-FR");
    document.getElementById("consumed-v").textContent = consumed.toLocaleString("fr-FR");

    setMacro("protein", protein, proteinGoal);
    setMacro("carbs", carbs, carbsGoal);
    setMacro("fat", fat, fatGoal);

    renderMeals(list);
  }

  loadCalories();
</script>
</body>
</html>
