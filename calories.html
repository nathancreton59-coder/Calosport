<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Calories — Suivi fitness</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg: #12161B;
    --surface: #1B2128;
    --surface-2: #222A32;
    --text: #F2F0EA;
    --text-muted: #8A93A0;
    --line: #2A323B;

    --lime: #D4F252;
    --lime-dim: #3A4420;
    --flame: #FF7A59;
    --flame-dim: #3D2620;
    --volt: #6FA8FF;
    --volt-dim: #202B3D;
    --grape: #C892FF;
    --grape-dim: #2E2440;
  }

  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0;
    background:#0A0C0F;
    font-family:'Inter', sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  body{ display:flex; min-height:100vh; }

  /* ---------- sidebar (identique sur toutes les pages) ---------- */
  .sidebar{
    width: 264px; flex-shrink:0;
    background: var(--bg); border-right:1px solid var(--line);
    padding: 28px 18px; display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh;
  }
  .sidebar-brand{ display:flex; align-items:center; gap:12px; padding: 6px 10px 30px; }
  .brand-mark{
    width:38px; height:38px; border-radius:12px; background:var(--lime);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .brand-name{ font-family:'Unbounded'; font-weight:700; font-size:14.5px; line-height:1.25; }
  .brand-name span{ display:block; font-family:'Inter'; font-weight:600; font-size:11px; color:var(--text-muted); margin-top:2px; }

  .sidebar-nav{ display:flex; flex-direction:column; gap:4px; }
  .sidebar-link{
    display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:13px;
    color: var(--text-muted); text-decoration:none; font-weight:600; font-size:14px;
  }
  .sidebar-link .dot{ width:7px; height:7px; border-radius:50%; background: var(--text-muted); flex-shrink:0; }
  .sidebar-link.active{ background: var(--surface); color: var(--text); }
  .sidebar-link.home.active .dot{ background: var(--lime); box-shadow:0 0 6px rgba(212,242,82,0.6); }
  .sidebar-link.cal.active .dot{ background: var(--flame); box-shadow:0 0 6px rgba(255,122,89,0.6); }
  .sidebar-link.sport.active .dot{ background: var(--volt); box-shadow:0 0 6px rgba(111,168,255,0.6); }
  .sidebar-link.settings{ margin-top:8px; padding-top:14px; border-top:1px solid var(--line); }

  .sidebar-footer{ margin-top:auto; padding-top:16px; border-top:1px solid var(--line); }
  .sidebar-logout{
    width:100%; display:flex; align-items:center; gap:10px; padding:11px 14px; border-radius:13px;
    background:none; border:none; color:var(--text-muted); font-family:'Inter'; font-weight:600; font-size:13px; cursor:pointer;
  }
  .sidebar-logout:hover{ background: var(--surface); color: var(--flame); }

  /* ---------- main ---------- */
  .main{ flex:1; padding: 48px 56px; min-width:0; }
  .main-inner{ max-width: 900px; }

  .page-header{ display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:32px; }
  .page-title{ font-family:'Unbounded'; font-weight:700; font-size:32px; }
  .page-header .date{ font-size:13px; color:var(--text-muted); margin-top:8px; text-transform:capitalize; }
  .add-meal-header-btn{
    display:flex; align-items:center; gap:8px; background: var(--flame); color:#12161B;
    border:none; border-radius:13px; padding:12px 18px; font-family:'Inter'; font-weight:700; font-size:13.5px; cursor:pointer;
  }

  .section-title{
    font-size: 12px; letter-spacing:0.1em; text-transform:uppercase;
    color: var(--text-muted); font-weight:700; margin: 0 0 14px;
  }

  .dashboard-grid{ display:grid; grid-template-columns: 1.4fr 1fr; gap:24px; align-items:start; }
  .col-stack{ display:flex; flex-direction:column; gap:28px; }

  /* grand anneau calories */
  .ring-card{
    background: linear-gradient(160deg, var(--surface) 0%, #171C22 100%);
    border: 1px solid var(--line);
    border-radius: 26px;
    padding: 32px;
    display:flex; align-items:center; gap:32px;
  }
  .big-ring{ position:relative; width:170px; height:170px; flex-shrink:0; }
  .big-ring svg{ transform: rotate(-90deg); width:170px; height:170px; }
  .big-ring .bg{ fill:none; stroke:#2A323B; stroke-width:14; }
  .big-ring .fg{
    fill:none; stroke: var(--flame); stroke-width:14; stroke-linecap:round;
    stroke-dasharray: 502; stroke-dashoffset: 178;
    filter: drop-shadow(0 0 8px rgba(255,122,89,0.4));
  }
  .big-ring-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .big-ring-center .num{ font-family:'Unbounded'; font-weight:800; font-size:27px; }
  .big-ring-center .lbl{ font-size:10.5px; color:var(--text-muted); margin-top:4px; text-align:center; }

  .ring-footer{ display:flex; flex-direction:column; gap:16px; }
  .ring-footer .item{ display:flex; align-items:baseline; justify-content:space-between; gap:20px; padding-bottom:14px; border-bottom:1px solid var(--line); }
  .ring-footer .item:last-child{ border-bottom:none; padding-bottom:0; }
  .ring-footer .item .v{ font-weight:700; font-size:16px; font-family:'Unbounded'; }
  .ring-footer .item .k{ font-size:12px; color:var(--text-muted); }

  /* macros */
  .macro-row{ display:flex; gap:14px; }
  .macro-card{
    flex:1; background: var(--surface); border:1px solid var(--line);
    border-radius:18px; padding:18px 14px; text-align:center;
  }
  .macro-ring{ position:relative; width:56px; height:56px; margin:0 auto 10px; }
  .macro-ring svg{ transform: rotate(-90deg); width:56px; height:56px; }
  .macro-ring .bg{ fill:none; stroke:#2A323B; stroke-width:6; }
  .macro-ring .fg{ fill:none; stroke-width:6; stroke-linecap:round; }
  .macro-card.p .fg{ stroke: var(--volt); }
  .macro-card.g .fg{ stroke: var(--lime); }
  .macro-card.l .fg{ stroke: var(--grape); }
  .macro-ring .val{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:700; }
  .macro-name{ font-size:12px; color:var(--text-muted); }
  .macro-amt{ font-size:13px; font-weight:600; margin-top:2px; }

  /* repas — colonne droite */
  .meal-group{ margin-bottom: 22px; }
  .meal-group-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .meal-group-title{ font-weight:700; font-size:14.5px; }
  .meal-group-kcal{ font-size:12px; color:var(--text-muted); }

  .food-item{
    display:flex; align-items:center; gap:12px;
    background: var(--surface); border:1px solid var(--line);
    border-radius:16px; padding:12px 14px; margin-bottom:8px;
  }
  .food-icon{
    width:36px; height:36px; border-radius:11px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:17px;
  }
  .food-icon.a{ background: var(--flame-dim); }
  .food-meta{ flex:1; min-width:0; }
  .food-name{ font-weight:600; font-size:13px; }
  .food-detail{ font-size:11px; color:var(--text-muted); margin-top:2px; }
  .food-kcal{ font-weight:700; font-size:13px; color: var(--text); white-space:nowrap; }
  .food-delete{
    width:26px; height:26px; border-radius:8px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background: transparent; border:none; cursor:pointer; color: var(--text-muted);
  }
  .food-delete:hover{ color: var(--flame); background: var(--flame-dim); }

  .add-meal-btn{
    width:100%; border:1.5px dashed var(--line); border-radius:16px;
    background: transparent; color: var(--text-muted);
    padding: 12px; font-size:12.5px; font-weight:600;
    display:flex; align-items:center; justify-content:center; gap:8px;
    font-family:'Inter'; cursor:pointer;
  }
  .add-meal-btn:hover{ border-color: var(--flame); color: var(--flame); }

  /* modale ajout d'aliment — centrée sur desktop */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(6,8,10,0.72);
    display:none; align-items:center; justify-content:center; z-index:50; padding:24px;
  }
  .modal-overlay.open{ display:flex; }
  .modal-sheet{
    width:100%; max-width:440px; background: var(--bg); border:1px solid var(--line);
    border-radius: 24px; padding: 26px; max-height:88vh; overflow-y:auto;
  }
  .modal-title{ font-family:'Unbounded'; font-weight:700; font-size:17px; margin-bottom:18px; }
  .modal-field{ margin-bottom:14px; }
  .modal-field label{ display:block; font-size:11.5px; color:var(--text-muted); margin-bottom:6px; font-weight:600; }
  .modal-field input, .modal-field select{
    width:100%; background: var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:12px; font-size:13.5px; color:var(--text); font-family:'Inter';
  }
  .modal-row{ display:flex; gap:10px; }
  .modal-row .modal-field{ flex:1; }
  .modal-actions{ display:flex; gap:10px; margin-top:18px; }
  .modal-btn{ flex:1; border:none; border-radius:14px; padding:13px; font-weight:700; font-size:13.5px; font-family:'Inter'; cursor:pointer; }
  .modal-btn.cancel{ background: var(--surface); color: var(--text-muted); border:1px solid var(--line); }
  .modal-btn.save{ background: var(--lime); color:#12161B; }
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-brand">
    <div class="brand-mark">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#12161B" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
    </div>
    <div class="brand-name">Suivi Fitness<span>Calories & sport</span></div>
  </div>

  <div class="sidebar-nav">
    <a class="sidebar-link home" href="index.html">
      <div class="dot"></div>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
      Accueil
    </a>
    <a class="sidebar-link cal active" href="calories.html">
      <div class="dot"></div>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c1 3-2 4-2 7a4 4 0 0 0 8 0c0-1-.5-2-1-2 .5 2-1 3-2 2 1-2-1-3-1-5 0-1 .5-2 1-3-2 0-3.5 1-3 3-2 0-3 2-3 4a6 6 0 0 0 6 6"/></svg>
      Calories
    </a>
    <a class="sidebar-link sport" href="sport.html">
      <div class="dot"></div>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="9" width="2.3" height="6" rx="1"/><rect x="4.3" y="7" width="2" height="10" rx="1"/><line x1="7.3" y1="12" x2="16.7" y2="12"/><rect x="17.7" y="7" width="2" height="10" rx="1"/><rect x="20.2" y="9" width="2.3" height="6" rx="1"/></svg>
      Sport
    </a>
    <a class="sidebar-link settings" href="settings.html">
      <div class="dot"></div>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
      Réglages
    </a>
  </div>

  <div class="sidebar-footer">
    <button class="sidebar-logout" onclick="logout()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      Déconnexion
    </button>
  </div>
</div>

<div class="main">
  <div class="main-inner">
    <div class="page-header">
      <div>
        <div class="page-title">Calories</div>
        <div class="date" id="cal-date">—</div>
      </div>
      <button class="add-meal-header-btn" onclick="openModal()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Ajouter un aliment
      </button>
    </div>

    <div class="dashboard-grid">
      <div class="col-stack">
        <div class="ring-card">
          <div class="big-ring">
            <svg viewBox="0 0 180 180">
              <circle class="bg" cx="90" cy="90" r="80"></circle>
              <circle class="fg" id="big-ring-fg" cx="90" cy="90" r="80"></circle>
            </svg>
            <div class="big-ring-center">
              <div class="num" id="remaining-num">—</div>
              <div class="lbl" id="remaining-lbl">kcal restantes</div>
            </div>
          </div>
          <div class="ring-footer">
            <div class="item"><div class="k">Objectif</div><div class="v" id="goal-v">—</div></div>
            <div class="item"><div class="k">Consommées</div><div class="v" id="consumed-v">—</div></div>
            <div class="item"><div class="k">Brûlées</div><div class="v" id="burned-v">0</div></div>
          </div>
        </div>

        <div>
          <div class="section-title">Macronutriments</div>
          <div class="macro-row">
            <div class="macro-card p">
              <div class="macro-ring">
                <svg viewBox="0 0 52 52">
                  <circle class="bg" cx="26" cy="26" r="21"></circle>
                  <circle class="fg" id="protein-ring" cx="26" cy="26" r="21" stroke-dasharray="132" stroke-dashoffset="132"></circle>
                </svg>
                <div class="val" id="protein-pct">0%</div>
              </div>
              <div class="macro-name">Protéines</div>
              <div class="macro-amt" id="protein-amt">0 / 0 g</div>
            </div>
            <div class="macro-card g">
              <div class="macro-ring">
                <svg viewBox="0 0 52 52">
                  <circle class="bg" cx="26" cy="26" r="21"></circle>
                  <circle class="fg" id="carbs-ring" cx="26" cy="26" r="21" stroke-dasharray="132" stroke-dashoffset="132"></circle>
                </svg>
                <div class="val" id="carbs-pct">0%</div>
              </div>
              <div class="macro-name">Glucides</div>
              <div class="macro-amt" id="carbs-amt">0 / 0 g</div>
            </div>
            <div class="macro-card l">
              <div class="macro-ring">
                <svg viewBox="0 0 52 52">
                  <circle class="bg" cx="26" cy="26" r="21"></circle>
                  <circle class="fg" id="fat-ring" cx="26" cy="26" r="21" stroke-dasharray="132" stroke-dashoffset="132"></circle>
                </svg>
                <div class="val" id="fat-pct">0%</div>
              </div>
              <div class="macro-name">Lipides</div>
              <div class="macro-amt" id="fat-amt">0 / 0 g</div>
            </div>
          </div>
        </div>
      </div>

      <div>
        <div class="section-title">Repas du jour</div>
        <div id="meals-container">Chargement des repas…</div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal-sheet">
    <div class="modal-title">Ajouter un aliment</div>
    <form onsubmit="submitMeal(event)">
      <div class="modal-field">
        <label>Nom de l'aliment</label>
        <input type="text" id="m-name" placeholder="Ex. Salade de poulet" required>
      </div>
      <div class="modal-row">
        <div class="modal-field">
          <label>Repas</label>
          <select id="m-type">
            <option value="petit-dejeuner">Petit-déjeuner</option>
            <option value="dejeuner">Déjeuner</option>
            <option value="diner">Dîner</option>
            <option value="collation">Collation</option>
          </select>
        </div>
        <div class="modal-field">
          <label>Calories (kcal)</label>
          <input type="number" id="m-cal" placeholder="350" min="0" required>
        </div>
      </div>
      <div class="modal-row">
        <div class="modal-field">
          <label>Protéines (g)</label>
          <input type="number" id="m-protein" placeholder="0" min="0" step="0.1">
        </div>
        <div class="modal-field">
          <label>Glucides (g)</label>
          <input type="number" id="m-carbs" placeholder="0" min="0" step="0.1">
        </div>
        <div class="modal-field">
          <label>Lipides (g)</label>
          <input type="number" id="m-fat" placeholder="0" min="0" step="0.1">
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="modal-btn cancel" onclick="closeModal()">Annuler</button>
        <button type="submit" class="modal-btn save">Ajouter</button>
      </div>
    </form>
  </div>
</div>

<script src="config.js"></script>
<script src="auth-guard.js"></script>
<script>
  const BIG_RING_CIRC = 502;   // 2 * PI * 80
  const MACRO_RING_CIRC = 132; // 2 * PI * 21

  const MEAL_GROUPS = [
    { key: "petit-dejeuner", label: "🌅 Petit-déjeuner" },
    { key: "dejeuner", label: "☀️ Déjeuner" },
    { key: "diner", label: "🌙 Dîner" },
    { key: "collation", label: "🍎 Collation" },
  ];

  function openModal(prefType){
    document.getElementById("modal-overlay").classList.add("open");
    if (prefType) document.getElementById("m-type").value = prefType;
  }
  function closeModal(){
    document.getElementById("modal-overlay").classList.remove("open");
    document.getElementById("m-name").value = "";
    document.getElementById("m-cal").value = "";
    document.getElementById("m-protein").value = "";
    document.getElementById("m-carbs").value = "";
    document.getElementById("m-fat").value = "";
  }

  async function submitMeal(e){
    e.preventDefault();
    const { error } = await supabaseClient.from("meals").insert({
      user_id: currentUser.id,
      name: document.getElementById("m-name").value.trim(),
      meal_type: document.getElementById("m-type").value,
      calories: parseInt(document.getElementById("m-cal").value) || 0,
      protein_g: parseFloat(document.getElementById("m-protein").value) || 0,
      carbs_g: parseFloat(document.getElementById("m-carbs").value) || 0,
      fat_g: parseFloat(document.getElementById("m-fat").value) || 0,
    });
    if (error){ alert("Erreur : " + error.message); return; }
    closeModal();
    loadCalories();
  }

  async function deleteMeal(mealId){
    if (!confirm("Supprimer cet aliment ?")) return;
    const { error } = await supabaseClient.from("meals").delete().eq("id", mealId);
    if (error){ alert("Erreur : " + error.message); return; }
    loadCalories();
  }

  function renderMeals(meals){
    const container = document.getElementById("meals-container");
    container.innerHTML = "";
    MEAL_GROUPS.forEach(group => {
      const items = meals.filter(m => m.meal_type === group.key);
      const totalKcal = items.reduce((s, m) => s + (m.calories || 0), 0);

      const groupEl = document.createElement("div");
      groupEl.className = "meal-group";

      const header = document.createElement("div");
      header.className = "meal-group-header";
      header.innerHTML = `<div class="meal-group-title">${group.label}</div><div class="meal-group-kcal">${items.length ? totalKcal.toLocaleString("fr-FR") + " kcal" : "Pas encore ajouté"}</div>`;
      groupEl.appendChild(header);

      items.forEach(m => {
        const time = new Date(m.logged_at).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
        const foodEl = document.createElement("div");
        foodEl.className = "food-item";
        foodEl.innerHTML = `
          <div class="food-icon a">🍽️</div>
          <div class="food-meta">
            <div class="food-name">${m.name}</div>
            <div class="food-detail">${time}</div>
          </div>
          <div class="food-kcal">${m.calories} kcal</div>
          <button class="food-delete" onclick="deleteMeal('${m.id}')" title="Supprimer">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>
          </button>`;
        groupEl.appendChild(foodEl);
      });

      const addBtn = document.createElement("button");
      addBtn.className = "add-meal-btn";
      addBtn.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg> Ajouter un aliment`;
      addBtn.onclick = () => openModal(group.key);
      groupEl.appendChild(addBtn);

      container.appendChild(groupEl);
    });
  }

  function setMacro(prefix, current, goal){
    const pct = goal > 0 ? Math.min(1, current / goal) : 0;
    document.getElementById(prefix + "-ring").style.strokeDashoffset = MACRO_RING_CIRC * (1 - pct);
    document.getElementById(prefix + "-pct").textContent = Math.round(pct * 100) + "%";
    document.getElementById(prefix + "-amt").textContent = `${Math.round(current)} / ${goal} g`;
  }

  async function loadCalories(){
    const user = await requireAuth();
    if (!user) return;

    document.getElementById("cal-date").textContent =
      new Date().toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });

    const { data: profile } = await supabaseClient
      .from("profiles").select("*").eq("id", user.id).single();
    const calorieGoal = profile?.calorie_goal ?? 2400;
    const proteinGoal = profile?.protein_goal_g ?? 120;
    const carbsGoal = profile?.carbs_goal_g ?? 160;
    const fatGoal = profile?.fat_goal_g ?? 70;

    const { data: meals } = await supabaseClient
      .from("meals").select("*")
      .eq("user_id", user.id)
      .gte("logged_at", startOfToday().toISOString())
      .lte("logged_at", endOfToday().toISOString())
      .order("logged_at", { ascending: true });

    const list = meals || [];
    const consumed = list.reduce((s, m) => s + (m.calories || 0), 0);
    const protein = list.reduce((s, m) => s + (Number(m.protein_g) || 0), 0);
    const carbs = list.reduce((s, m) => s + (Number(m.carbs_g) || 0), 0);
    const fat = list.reduce((s, m) => s + (Number(m.fat_g) || 0), 0);
    const remaining = Math.max(0, calorieGoal - consumed);

    document.getElementById("big-ring-fg").style.strokeDashoffset = BIG_RING_CIRC * (1 - Math.min(1, consumed / calorieGoal));
    document.getElementById("remaining-num").textContent = remaining.toLocaleString("fr-FR");
    document.getElementById("remaining-lbl").innerHTML = `kcal restantes<br>sur ${calorieGoal.toLocaleString("fr-FR")}`;
    document.getElementById("goal-v").textContent = calorieGoal.toLocaleString("fr-FR");
    document.getElementById("consumed-v").textContent = consumed.toLocaleString("fr-FR");

    setMacro("protein", protein, proteinGoal);
    setMacro("carbs", carbs, carbsGoal);
    setMacro("fat", fat, fatGoal);

    renderMeals(list);
  }

  loadCalories();
</script>
</body>
</html>
