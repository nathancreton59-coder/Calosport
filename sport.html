<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Sport — Suivi fitness</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg: #12161B;
    --surface: #1B2128;
    --text: #F2F0EA;
    --text-muted: #8A93A0;
    --line: #2A323B;

    --lime: #D4F252;
    --lime-dim: #3A4420;
    --flame: #FF7A59;
    --flame-dim: #3D2620;
    --volt: #6FA8FF;
    --volt-dim: #202B3D;
  }

  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0;
    background:#0A0C0F;
    font-family:'Inter', sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  body{ display:flex; min-height:100vh; }

  /* ---------- sidebar (identique sur toutes les pages) ---------- */
  .sidebar{
    width: 264px; flex-shrink:0;
    background: var(--bg); border-right:1px solid var(--line);
    padding: 28px 18px; display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh;
  }
  .sidebar-brand{ display:flex; align-items:center; gap:12px; padding: 6px 10px 30px; }
  .brand-mark{
    width:38px; height:38px; border-radius:12px; background:var(--lime);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .brand-name{ font-family:'Unbounded'; font-weight:700; font-size:14.5px; line-height:1.25; }
  .brand-name span{ display:block; font-family:'Inter'; font-weight:600; font-size:11px; color:var(--text-muted); margin-top:2px; }

  .sidebar-nav{ display:flex; flex-direction:column; gap:4px; }
  .sidebar-link{
    display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:13px;
    color: var(--text-muted); text-decoration:none; font-weight:600; font-size:14px;
  }
  .sidebar-link .dot{ width:7px; height:7px; border-radius:50%; background: var(--text-muted); flex-shrink:0; }
  .sidebar-link.active{ background: var(--surface); color: var(--text); }
  .sidebar-link.home.active .dot{ background: var(--lime); box-shadow:0 0 6px rgba(212,242,82,0.6); }
  .sidebar-link.cal.active .dot{ background: var(--flame); box-shadow:0 0 6px rgba(255,122,89,0.6); }
  .sidebar-link.sport.active .dot{ background: var(--volt); box-shadow:0 0 6px rgba(111,168,255,0.6); }
  .sidebar-link.settings{ margin-top:8px; padding-top:14px; border-top:1px solid var(--line); }
  .sidebar-link.library.active .dot{ background: var(--text); }

  .sidebar-footer{ margin-top:auto; padding-top:16px; border-top:1px solid var(--line); }
  .sidebar-logout{
    width:100%; display:flex; align-items:center; gap:10px; padding:11px 14px; border-radius:13px;
    background:none; border:none; color:var(--text-muted); font-family:'Inter'; font-weight:600; font-size:13px; cursor:pointer;
  }
  .sidebar-logout:hover{ background: var(--surface); color: var(--flame); }

  /* ---------- main ---------- */
  .main{ flex:1; padding: 48px 56px 100px; min-width:0; }
  .main-inner{ max-width: 900px; }

  .page-header{
    display:flex; align-items:flex-end; justify-content:space-between;
    margin: 0 0 32px;
  }
  .page-title{ font-family:'Unbounded'; font-weight:700; font-size:32px; }
  .page-header .date{ font-size:13px; color:var(--text-muted); margin-top:8px; text-transform:capitalize; }
  .goal-btn{
    display:flex; align-items:center; gap:8px; background: var(--volt); color:#12161B;
    border:none; border-radius:13px; padding:12px 18px; font-family:'Inter'; font-weight:700; font-size:13.5px; cursor:pointer;
  }

  /* ---------- grille desktop ---------- */
  .dashboard-grid{ display:grid; grid-template-columns: 1.4fr 1fr; gap:24px; align-items:start; margin-bottom:32px; }
  .col-stack{ display:flex; flex-direction:column; gap:16px; }

  /* semaine — barres d'activite (signature) */
  .week-card{
    background: linear-gradient(165deg, var(--surface) 0%, #171C22 100%);
    border: 1px solid var(--line);
    border-radius: 26px;
    padding: 26px 26px 20px;
  }
  .week-top{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:16px; }
  .week-top .t{ font-weight:700; font-size:14.5px; }
  .week-top .v{ font-family:'Unbounded'; font-weight:700; font-size:15px; color: var(--volt); }

  .bars{ display:flex; align-items:flex-end; justify-content:space-between; height:88px; padding:0 2px; }
  .bar-col{ display:flex; flex-direction:column; align-items:center; gap:8px; width:26px; }
  .bar-track{
    width: 10px; height:64px; border-radius:6px; background:#2A323B;
    display:flex; align-items:flex-end; overflow:hidden;
  }
  .bar-fill{ width:100%; border-radius:6px; background: var(--volt); }
  .bar-col.today .bar-fill{ background: var(--lime); box-shadow: 0 0 8px rgba(212,242,82,0.4); }
  .bar-col .d{ font-size:10.5px; color: var(--text-muted); font-weight:600; }
  .bar-col.today .d{ color: var(--lime); }

  /* stats rapides */
  .section-title{
    font-size: 12px; letter-spacing:0.1em; text-transform:uppercase;
    color: var(--text-muted); font-weight:700; margin: 6px 0 12px;
  }
  .stat-row{ display:flex; flex-direction:column; gap: 12px; }
  .stat-card{
    background: var(--surface); border:1px solid var(--line);
    border-radius: 20px; padding: 18px; display:flex; align-items:center; gap:14px;
  }
  .stat-icon{
    width:38px; height:38px; border-radius: 12px; background: var(--volt-dim);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-bottom:0;
  }
  .stat-value{ font-family:'Unbounded'; font-weight:700; font-size:19px; }
  .stat-label{ font-size:11.5px; color:var(--text-muted); margin-top:2px; }

  /* seance du jour */
  .workout-hero{
    background: linear-gradient(150deg, var(--volt-dim) 0%, #171C22 65%);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 26px;
    position: relative;
    overflow:hidden;
  }
  .workout-hero .eyebrow{
    font-size:11px; letter-spacing:0.1em; text-transform:uppercase;
    color: var(--volt); font-weight:700; margin-bottom:6px;
  }
  .workout-hero .title{ font-family:'Unbounded'; font-weight:700; font-size:19px; margin-bottom:6px; }
  .workout-hero .meta{ font-size:12.5px; color:var(--text-muted); }
  .start-btn{
    margin-top:16px; width:100%; border:none; border-radius:16px;
    background: var(--lime); color:#12161B; font-family:'Inter'; font-weight:700;
    font-size:14px; padding:14px; display:flex; align-items:center; justify-content:center; gap:8px;
  }

  /* liste exercices */
  .exo-item{
    display:flex; align-items:center; gap:12px;
    background: var(--surface); border:1px solid var(--line);
    border-radius:18px; padding:12px 14px; margin-bottom:8px;
  }
  .exo-num{
    width:30px; height:30px; border-radius:10px; background: var(--volt-dim);
    color: var(--volt); font-family:'Unbounded'; font-size:12px; font-weight:700;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .exo-meta{ flex:1; }
  .exo-name{ font-weight:600; font-size:13.5px; }
  .exo-detail{ font-size:11.5px; color:var(--text-muted); margin-top:2px; }
  .exo-check{
    width:26px; height:26px; border-radius:50%; border:1.5px solid var(--line);
    flex-shrink:0;
  }
  .exo-check.done{
    background: var(--lime); border-color: var(--lime);
    display:flex; align-items:center; justify-content:center;
  }
  .exo-delete, .history-delete, .hero-delete, .exo-edit, .history-edit, .hero-edit, .history-duplicate, .hero-duplicate{
    background:none; border:none; cursor:pointer; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    color: var(--text-muted);
  }
  .exo-delete, .history-delete, .exo-edit, .history-edit, .history-duplicate{ width:26px; height:26px; border-radius:8px; }
  .exo-delete:hover, .history-delete:hover{ color: var(--flame); background: var(--flame-dim); }
  .exo-edit:hover, .history-edit:hover, .history-duplicate:hover{ color: var(--volt); background: var(--volt-dim); }
  .hero-delete, .hero-edit, .hero-duplicate{
    position:absolute; top:16px; width:30px; height:30px; border-radius:10px;
    background: rgba(0,0,0,0.25);
  }
  .hero-delete{ right:16px; }
  .hero-edit{ right:54px; }
  .hero-duplicate{ right:92px; }
  .hero-delete:hover{ color: var(--flame); background: var(--flame-dim); }
  .hero-edit:hover, .hero-duplicate:hover{ color: var(--volt); background: var(--volt-dim); }
  .history-actions{ display:flex; gap:4px; flex-shrink:0; }

  /* ---------- detail de seance passee ---------- */
  .detail-exo{ margin-bottom:18px; }
  .detail-exo-name{ font-weight:700; font-size:14px; margin-bottom:8px; }
  .detail-set-row{
    display:flex; align-items:center; gap:10px; padding:9px 12px;
    background: var(--surface-2, #222A32); border-radius:12px; margin-bottom:6px; font-size:12.5px;
  }
  .detail-set-num{ width:22px; color: var(--text-muted); font-weight:700; flex-shrink:0; }
  .detail-set-val{ flex:1; }
  .detail-set-record{
    background: var(--lime-dim); color: var(--lime); font-size:10.5px; font-weight:700;
    padding:3px 8px; border-radius:8px; flex-shrink:0;
  }
  .detail-summary{
    display:flex; gap:12px; margin-bottom:20px; padding-bottom:16px; border-bottom:1px solid var(--line);
  }
  .detail-summary .item{ flex:1; text-align:center; }
  .detail-summary .v{ font-family:'Unbounded'; font-weight:700; font-size:16px; }
  .detail-summary .k{ font-size:10.5px; color:var(--text-muted); margin-top:3px; }
  .detail-empty{ color:var(--text-muted); font-size:12.5px; text-align:center; padding:20px; }

  /* historique */
  .history-item{
    display:flex; align-items:center; gap:12px;
    padding: 12px 2px; border-bottom: 1px solid var(--line);
  }
  .history-item:last-child{ border-bottom:none; }
  .history-icon{
    width:36px; height:36px; border-radius:12px; background: var(--volt-dim);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .history-meta{ flex:1; }
  .history-name{ font-weight:600; font-size:13px; }
  .history-date{ font-size:11.5px; color:var(--text-muted); margin-top:2px; }
  .history-dur{ font-size:12.5px; color:var(--text-muted); font-weight:600; }

  /* bottom nav (identique) */
  .navbar{
    position:absolute; left:0; right:0; bottom:0; height:108px;
    background: linear-gradient(180deg, rgba(18,22,27,0) 0%, var(--bg) 30%);
    display:flex; align-items:flex-end; justify-content:center; padding-bottom:26px;
  }
  .nav-pill{
    width:300px; height:66px;
    background: rgba(27,33,40,0.9); backdrop-filter: blur(14px);
    border:1px solid var(--line); border-radius:33px;
    display:flex; align-items:center; justify-content:space-between;
    padding: 0 22px; position:relative;
  }
  .nav-item{
    display:flex; flex-direction:column; align-items:center; gap:4px;
    color: var(--text-muted); width:44px; position:relative;
    text-decoration:none; cursor:pointer;
  }
  .nav-item .lbl{ font-size:10px; font-weight:600; }
  .nav-item.cal{ color: var(--flame); }
  .nav-item.sport{ color: var(--volt); }
  .nav-item.active .chip{
    position:absolute; top:-8px; left:50%; transform:translateX(-50%);
    width:34px; height:34px; border-radius:11px; z-index:-1;
  }
  .nav-item.sport.active .chip{ background: var(--volt-dim); }

  .nav-home{
    position:absolute; left:50%; top:-26px; transform:translateX(-50%);
    width:64px; height:64px; border-radius:50%;
    background: var(--lime);
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 8px 24px rgba(212,242,82,0.2), 0 0 0 6px var(--bg);
    text-decoration:none; cursor:pointer;
  }
  .nav-home-label{
    position:absolute; left:50%; transform:translateX(-50%);
    top:40px; font-size:10px; font-weight:700; color: var(--text-muted);
    white-space:nowrap;
  }

  /* bouton flottant nouvelle seance */
  .fab{
    position:fixed; right:40px; bottom:40px; z-index:20;
    width:56px; height:56px; border-radius:50%;
    background: var(--volt); color:#12161B;
    display:flex; align-items:center; justify-content:center;
    border:none; box-shadow: 0 10px 24px rgba(111,168,255,0.4);
    cursor:pointer;
  }

  /* modale creation de seance — centrée sur desktop */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(6,8,10,0.72);
    display:none; align-items:center; justify-content:center; z-index:50; padding:24px;
  }
  .modal-overlay.open{ display:flex; }
  .modal-sheet{
    width:100%; max-width:480px; background: var(--bg); border:1px solid var(--line);
    border-radius: 24px; padding: 26px; max-height:88vh; overflow-y:auto;
  }
  .modal-title{ font-family:'Unbounded'; font-weight:700; font-size:17px; margin-bottom:16px; }
  .modal-field{ margin-bottom:12px; }
  .modal-field label{ display:block; font-size:11.5px; color:var(--text-muted); margin-bottom:6px; font-weight:600; }
  .modal-field input, .modal-field select{
    width:100%; background: var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:12px; font-size:13.5px; color:var(--text); font-family:'Inter';
  }
  .modal-row{ display:flex; gap:10px; }
  .modal-row .modal-field{ flex:1; }
  .modal-actions{ display:flex; gap:10px; margin-top:16px; }
  .modal-btn{
    flex:1; border:none; border-radius:14px; padding:13px; font-weight:700; font-size:13.5px; font-family:'Inter';
  }
  .modal-btn.cancel{ background: var(--surface); color: var(--text-muted); border:1px solid var(--line); }
  .modal-btn.save{ background: var(--volt); color:#12161B; }

  .exo-row{
    display:flex; flex-direction:column; gap:8px;
    background: var(--surface); border:1px solid var(--line); border-radius:14px; padding:10px; margin-bottom:8px;
  }
  .exo-row-top{ display:flex; gap:8px; align-items:center; }
  .exo-row-bottom{ display:flex; gap:8px; align-items:center; }
  .exo-row input{
    background: var(--bg); border:1px solid var(--line); border-radius:10px;
    padding:9px; font-size:12.5px; color:var(--text); font-family:'Inter';
  }
  .exo-row select.exo-select{
    flex:1; min-width:0; background: var(--bg); border:1px solid var(--line); border-radius:10px;
    padding:9px; font-size:12.5px; color:var(--text); font-family:'Inter';
  }
  .exo-row .exo-custom-input{ flex:1; min-width:0; display:none; }
  .exo-row .exo-sets-input, .exo-row .exo-reps-input, .exo-row .exo-rest-input{ width:100%; text-align:center; }
  .exo-row .exo-mini{ flex:1; text-align:center; }
  .exo-row .exo-mini .u{ font-size:9px; color:var(--text-muted); display:block; margin-bottom:3px; }
  .exo-row .exo-remove{
    background:none; border:none; color:var(--text-muted); cursor:pointer;
    width:26px; height:26px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  }
  .add-exo-btn{
    width:100%; border:1.5px dashed var(--line); border-radius:14px;
    background: transparent; color: var(--text-muted); padding:11px; font-size:12.5px; font-weight:600;
    display:flex; align-items:center; justify-content:center; gap:6px; font-family:'Inter'; margin-bottom:6px;
  }

  .exo-row.legacy .exo-custom-input{ flex:1; min-width:120px; display:none; }

  /* ---------- configurateur de series (planification) ---------- */
  .exo-config-toggle{
    display:flex; align-items:center; justify-content:space-between;
    background: var(--bg); border:1px solid var(--line); border-radius:12px;
    padding:10px 12px; cursor:pointer; font-size:12px; color:var(--text-muted); font-weight:600;
  }
  .exo-config-toggle .chev{ transition: transform .15s ease; }
  .exo-config-toggle.open .chev{ transform: rotate(180deg); }
  .exo-config-panel{ display:none; padding-top:4px; }
  .exo-config-panel.open{ display:block; }

  .ecp-rest-row{ display:flex; align-items:center; gap:10px; margin:10px 0 14px; }
  .ecp-rest-row label{ font-size:11.5px; color:var(--text-muted); font-weight:600; flex:1; }
  .ecp-rest-row input{ width:70px; text-align:center; }

  .ecp-section{ margin-bottom:14px; }
  .ecp-section-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .ecp-section-title{ font-weight:700; font-size:12.5px; }
  .ecp-toggle-visibility{ background:none; border:none; color: var(--volt); font-weight:700; font-size:11.5px; cursor:pointer; font-family:'Inter'; }

  .ecp-table-head{
    display:grid; grid-template-columns: 44px 1fr 1fr 26px; gap:8px;
    font-size:10px; color:var(--text-muted); font-weight:700; text-transform:uppercase; letter-spacing:0.05em;
    padding:0 2px; margin-bottom:6px;
  }
  .ecp-set-row{
    display:grid; grid-template-columns: 44px 1fr 1fr 26px; gap:8px; align-items:center; margin-bottom:6px;
  }
  .ecp-set-num{
    width:44px; height:34px; border-radius:10px; background: var(--bg); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12.5px; color: var(--text-muted);
  }
  .ecp-set-row input{ width:100%; text-align:center; padding:8px 6px; }
  .ecp-set-remove{
    background:none; border:none; color: var(--text-muted); cursor:pointer; width:26px; height:26px;
    display:flex; align-items:center; justify-content:center;
  }
  .ecp-add-set{
    width:100%; background:none; border:1.5px dashed var(--line); border-radius:12px;
    color: var(--lime); font-family:'Inter'; font-weight:700; font-size:12px; padding:9px; cursor:pointer;
  }

  /* ---------- mode live ---------- */
  .live-overlay{
    position:fixed; inset:0; background: var(--bg); z-index:80;
    display:none; flex-direction:column;
  }
  .live-overlay.open{ display:flex; }
  .live-top{
    display:flex; align-items:center; justify-content:space-between;
    padding: 26px 22px 10px; max-width:520px; margin:0 auto; width:100%;
  }
  .live-close{
    width:34px; height:34px; border-radius:11px; background:var(--surface); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text-muted);
  }
  .live-progress-lbl{ font-size:12px; color:var(--text-muted); font-weight:600; }
  .live-body{ flex:1; overflow-y:auto; padding: 6px 22px 24px; max-width:520px; margin:0 auto; width:100%; }

  .live-exo-name{ font-family:'Unbounded'; font-weight:700; font-size:21px; margin: 6px 0 4px; }
  .live-exo-meta{ font-size:12.5px; color:var(--text-muted); margin-bottom:20px; }

  .set-row{
    display:flex; align-items:center; gap:10px;
    background: var(--surface); border:1px solid var(--line); border-radius:16px;
    padding:12px 14px; margin-bottom:10px;
  }
  .set-row.done{ border-color: var(--volt); }
  .set-num{
    width:28px; height:28px; border-radius:9px; background: var(--volt-dim); color: var(--volt);
    font-family:'Unbounded'; font-size:11px; font-weight:700;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .set-input-group{ flex:1; display:flex; gap:8px; }
  .set-input-group input{
    width:100%; background: var(--bg); border:1px solid var(--line); border-radius:10px;
    padding:9px; font-size:13px; color:var(--text); font-family:'Inter'; text-align:center;
  }
  .set-input-group .grp{ flex:1; }
  .set-input-group .grp .u{ font-size:9.5px; color:var(--text-muted); display:block; text-align:center; margin-bottom:4px; }
  .set-validate{
    width:36px; height:36px; border-radius:50%; border:1.5px solid var(--line); background:transparent;
    color: var(--text-muted); flex-shrink:0; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .set-validate.done{ background: var(--volt); border-color:var(--volt); color:#12161B; }

  .rest-card{
    margin-top: 6px; background: linear-gradient(165deg, var(--volt-dim) 0%, #171C22 100%);
    border:1px solid var(--line); border-radius:22px; padding:26px 20px; text-align:center;
  }
  .rest-label{ font-size:12px; letter-spacing:0.1em; text-transform:uppercase; color:var(--volt); font-weight:700; margin-bottom:10px; }
  .rest-time{ font-family:'Unbounded'; font-weight:800; font-size:44px; margin-bottom:16px; }
  .rest-bar-track{ height:6px; border-radius:3px; background:#2A323B; overflow:hidden; margin-bottom:16px; }
  .rest-bar-fill{ height:100%; background: var(--volt); border-radius:3px; transition: width 1s linear; }
  .rest-actions{ display:flex; gap:10px; }
  .rest-btn{
    flex:1; border:none; border-radius:12px; padding:11px; font-weight:700; font-size:12.5px; font-family:'Inter'; cursor:pointer;
  }

</style>

<script src="config.js"></script>

<script>
  const DAY_LABELS = ["L", "M", "M", "J", "V", "S", "D"];
  let activeWorkoutId = null;
  let exoRowCount = 0;
  let EXERCISE_LIBRARY = [];

  async function loadExerciseLibrary(){
    const { data } = await supabaseClient
      .from("exercise_library").select("*")
      .order("muscle_group", { ascending: true })
      .order("name", { ascending: true });
    EXERCISE_LIBRARY = data || [];
  }

  function exerciseSelectOptionsHtml(){
    const groups = {};
    EXERCISE_LIBRARY.forEach(ex => {
      const g = ex.muscle_group || "Autre";
      if (!groups[g]) groups[g] = [];
      groups[g].push(ex);
    });
    let html = `<option value="" disabled selected>Choisir un exercice…</option>`;
    Object.keys(groups).forEach(g => {
      html += `<optgroup label="${g}">`;
      groups[g].forEach(ex => { html += `<option value="${ex.id}">${ex.name}</option>`; });
      html += `</optgroup>`;
    });
    html += `<option value="__custom__">➕ Créer un nouvel exercice…</option>`;
    return html;
  }

  function openWorkoutModal(){
    document.getElementById("workout-modal-title").textContent = "Nouvelle séance";
    document.getElementById("workout-modal-submit").textContent = "Créer la séance";
    document.getElementById("w-id").value = "";
    document.getElementById("workout-modal-overlay").classList.add("open");
    const today = new Date();
    document.getElementById("w-date").value = today.toISOString().slice(0,10);
    document.getElementById("w-time").value = today.toTimeString().slice(0,5);
    if (document.getElementById("exo-rows").children.length === 0){
      addExoRow(); addExoRow();
    }
  }
  function closeWorkoutModal(){
    document.getElementById("workout-modal-overlay").classList.remove("open");
    document.getElementById("w-id").value = "";
    document.getElementById("w-name").value = "";
    document.getElementById("w-type").value = "";
    document.getElementById("w-duration").value = "";
    document.getElementById("w-calories").value = "";
    document.getElementById("exo-rows").innerHTML = "";
    exoRowCount = 0;
    plannedSetsByRow = {};
  }

  async function editWorkout(workoutId){
    const { data: workout, error } = await supabaseClient
      .from("workouts").select("*").eq("id", workoutId).single();
    if (error || !workout){ alert("Impossible de charger cette séance."); return; }

    const { data: exercises } = await supabaseClient
      .from("exercises").select("*").eq("workout_id", workoutId).order("position", { ascending: true });

    document.getElementById("workout-modal-title").textContent = "Modifier la séance";
    document.getElementById("workout-modal-submit").textContent = "Enregistrer les modifications";
    document.getElementById("w-id").value = workout.id;
    document.getElementById("w-name").value = workout.name || "";
    document.getElementById("w-type").value = workout.workout_type || "";
    document.getElementById("w-duration").value = workout.duration_min || "";
    document.getElementById("w-calories").value = workout.calories_burned || "";
    if (workout.scheduled_at){
      const d = new Date(workout.scheduled_at);
      document.getElementById("w-date").value = d.toISOString().slice(0,10);
      document.getElementById("w-time").value = d.toTimeString().slice(0,5);
    }

    document.getElementById("exo-rows").innerHTML = "";
    exoRowCount = 0;
    for (const ex of (exercises || [])){
      addExoRow();
      const id = "exo-row-" + (exoRowCount - 1);
      const row = document.getElementById(id);
      const select = row.querySelector(".exo-select");
      const customInput = row.querySelector(".exo-custom-input");
      if (ex.exercise_library_id && EXERCISE_LIBRARY.some(e => e.id === ex.exercise_library_id)){
        select.value = ex.exercise_library_id;
      } else {
        select.value = "__custom__";
        customInput.style.display = "block";
        customInput.value = ex.name || "";
      }

      const { data: existingSets } = await supabaseClient
        .from("workout_sets").select("*").eq("exercise_id", ex.id).order("set_number", { ascending: true });

      const plan = plannedSetsByRow[id];
      plan.rest = ex.rest_seconds || 90;
      const warmupSets = (existingSets || []).filter(s => s.is_warmup);
      const workingSets = (existingSets || []).filter(s => !s.is_warmup);
      if (warmupSets.length) plan.warmup = warmupSets.map(s => ({ reps: s.reps ?? "", weight: s.weight_kg ?? "" }));
      if (workingSets.length) plan.working = workingSets.map(s => ({ reps: s.reps ?? "", weight: s.weight_kg ?? "" }));

      const restInput = row.querySelector(".ecp-rest-row input");
      if (restInput) restInput.value = plan.rest;

      renderPlannedSetRows(id, true);
      renderPlannedSetRows(id, false);
      if (warmupSets.length){
        document.getElementById("warmup-table-" + id).style.display = "block";
        document.getElementById("warmup-toggle-" + id).textContent = "Masquer";
      }
    }
    if (!(exercises || []).length){ addExoRow(); addExoRow(); }

    document.getElementById("workout-modal-overlay").classList.add("open");
  }

  async function duplicateWorkout(workoutId){
    await editWorkout(workoutId);
    // On repart du même contenu, mais comme une nouvelle séance (pas une modification)
    document.getElementById("w-id").value = "";
    document.getElementById("workout-modal-title").textContent = "Dupliquer la séance";
    document.getElementById("workout-modal-submit").textContent = "Créer la séance";
    const today = new Date();
    document.getElementById("w-date").value = today.toISOString().slice(0, 10);
    document.getElementById("w-time").value = today.toTimeString().slice(0, 5);
  }

  let plannedSetsByRow = {}; // { rowId: { rest: 90, warmup: [{reps,weight}], working: [{reps,weight}] } }

  function defaultPlanForRow(){
    return {
      rest: 90,
      warmup: [],
      working: [{ reps: "", weight: "" }, { reps: "", weight: "" }, { reps: "", weight: "" }],
      warmupVisible: true,
    };
  }

  function onExoSelectChange(selectEl){
    const row = selectEl.closest(".exo-row");
    const customInput = row.querySelector(".exo-custom-input");
    customInput.style.display = selectEl.value === "__custom__" ? "block" : "none";
  }

  function addExoRow(){
    const id = "exo-row-" + (exoRowCount++);
    plannedSetsByRow[id] = defaultPlanForRow();
    const row = document.createElement("div");
    row.className = "exo-row";
    row.id = id;
    row.innerHTML = `
      <div class="exo-row-top">
        <select class="exo-select" onchange="onExoSelectChange(this)">${exerciseSelectOptionsHtml()}</select>
        <input type="text" class="exo-custom-input" placeholder="Nom du nouvel exercice">
        <button type="button" class="exo-remove" onclick="delete plannedSetsByRow['${id}']; document.getElementById('${id}').remove()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="exo-config-toggle" onclick="toggleExoConfig('${id}')">
        <span id="exo-summary-${id}">3 séries efficaces · 90s repos</span>
        <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <div class="exo-config-panel" id="exo-config-${id}">
        <div class="ecp-rest-row">
          <label>Repos entre séries</label>
          <input type="number" min="0" step="5" value="90" onchange="setRest('${id}', this.value)">
          <span style="font-size:11.5px; color:var(--text-muted);">sec</span>
        </div>

        <div class="ecp-section">
          <div class="ecp-section-head">
            <div class="ecp-section-title">Séries d'échauffement</div>
            <button type="button" class="ecp-toggle-visibility" onclick="toggleWarmupVisibility('${id}')" id="warmup-toggle-${id}">Afficher</button>
          </div>
          <div id="warmup-table-${id}" style="display:none;">
            <div class="ecp-table-head"><div>Série</div><div>Répétitions</div><div>Kg</div><div></div></div>
            <div id="warmup-rows-${id}"></div>
            <button type="button" class="ecp-add-set" onclick="addPlannedSet('${id}', true)">+ Ajouter une série d'échauffement</button>
          </div>
        </div>

        <div class="ecp-section">
          <div class="ecp-section-head"><div class="ecp-section-title">Séries efficaces</div></div>
          <div class="ecp-table-head"><div>Série</div><div>Répétitions</div><div>Kg</div><div></div></div>
          <div id="working-rows-${id}"></div>
          <button type="button" class="ecp-add-set" onclick="addPlannedSet('${id}', false)">+ Ajouter une série</button>
        </div>
      </div>`;
    document.getElementById("exo-rows").appendChild(row);
    renderPlannedSetRows(id, true);
    renderPlannedSetRows(id, false);
  }

  function toggleExoConfig(id){
    document.getElementById("exo-config-" + id).classList.toggle("open");
    document.querySelector(`#${id} .exo-config-toggle`).classList.toggle("open");
  }

  function toggleWarmupVisibility(id){
    const table = document.getElementById("warmup-table-" + id);
    const btn = document.getElementById("warmup-toggle-" + id);
    const nowVisible = table.style.display === "none";
    table.style.display = nowVisible ? "block" : "none";
    btn.textContent = nowVisible ? "Masquer" : "Afficher";
  }

  function setRest(id, value){
    plannedSetsByRow[id].rest = parseInt(value) || 90;
    updateExoSummary(id);
  }

  function addPlannedSet(id, isWarmup){
    const plan = plannedSetsByRow[id];
    (isWarmup ? plan.warmup : plan.working).push({ reps: "", weight: "" });
    if (isWarmup && plan.warmup.length === 1){
      document.getElementById("warmup-table-" + id).style.display = "block";
      document.getElementById("warmup-toggle-" + id).textContent = "Masquer";
    }
    renderPlannedSetRows(id, isWarmup);
    updateExoSummary(id);
  }

  function removePlannedSet(id, isWarmup, index){
    const plan = plannedSetsByRow[id];
    (isWarmup ? plan.warmup : plan.working).splice(index, 1);
    renderPlannedSetRows(id, isWarmup);
    updateExoSummary(id);
  }

  function updatePlannedSetField(id, isWarmup, index, field, value){
    plannedSetsByRow[id][isWarmup ? "warmup" : "working"][index][field] = value;
    if (field === "reps" || field === "weight") updateExoSummary(id);
  }

  function renderPlannedSetRows(id, isWarmup){
    const plan = plannedSetsByRow[id];
    const list = isWarmup ? plan.warmup : plan.working;
    const container = document.getElementById((isWarmup ? "warmup-rows-" : "working-rows-") + id);
    container.innerHTML = "";
    list.forEach((s, i) => {
      const row = document.createElement("div");
      row.className = "ecp-set-row";
      row.innerHTML = `
        <div class="ecp-set-num">${i + 1}</div>
        <input type="number" min="0" placeholder="10" value="${s.reps}"
               onchange="updatePlannedSetField('${id}', ${isWarmup}, ${i}, 'reps', this.value)">
        <input type="number" min="0" step="0.5" placeholder="0" value="${s.weight}"
               onchange="updatePlannedSetField('${id}', ${isWarmup}, ${i}, 'weight', this.value)">
        <button type="button" class="ecp-set-remove" onclick="removePlannedSet('${id}', ${isWarmup}, ${i})">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>`;
      container.appendChild(row);
    });
    updateExoSummary(id);
  }

  function updateExoSummary(id){
    const el = document.getElementById("exo-summary-" + id);
    if (!el) return;
    const plan = plannedSetsByRow[id];
    const warmupTxt = plan.warmup.length ? `${plan.warmup.length} échauffement + ` : "";
    el.textContent = `${warmupTxt}${plan.working.length} série${plan.working.length > 1 ? "s" : ""} efficace${plan.working.length > 1 ? "s" : ""} · ${plan.rest}s repos`;
  }

  async function submitWorkout(e){
    e.preventDefault();
    const editId = document.getElementById("w-id").value;
    const name = document.getElementById("w-name").value.trim();
    const type = document.getElementById("w-type").value.trim();
    const duration = parseInt(document.getElementById("w-duration").value) || null;
    const calories = parseInt(document.getElementById("w-calories").value) || null;
    const date = document.getElementById("w-date").value;
    const time = document.getElementById("w-time").value;
    const scheduledAt = new Date(`${date}T${time}`).toISOString();

    let workout;
    if (editId){
      const { data, error } = await supabaseClient
        .from("workouts")
        .update({ name, workout_type: type || null, duration_min: duration, calories_burned: calories, scheduled_at: scheduledAt })
        .eq("id", editId)
        .select().single();
      if (error){ alert("Erreur : " + error.message); return; }
      workout = data;
      // On repart des exercices actuels du formulaire : on supprime les anciens puis on réinsère
      // (les séries déjà loggées sur cette séance seront donc réinitialisées)
      await supabaseClient.from("exercises").delete().eq("workout_id", editId);
    } else {
      const { data, error } = await supabaseClient
        .from("workouts")
        .insert({
          user_id: currentUser.id,
          name, workout_type: type || null,
          duration_min: duration, calories_burned: calories,
          scheduled_at: scheduledAt, completed: false
        })
        .select().single();
      if (error){ alert("Erreur : " + error.message); return; }
      workout = data;
    }

    const exoRows = Array.from(document.querySelectorAll(".exo-row"));
    const exercisesToInsert = [];
    const rowIdByIndex = [];

    for (const row of exoRows){
      const rowId = row.id;
      const plan = plannedSetsByRow[rowId];
      const select = row.querySelector(".exo-select");
      const customInput = row.querySelector(".exo-custom-input");

      let libraryId = null;
      let exName = "";

      if (select.value === "__custom__"){
        exName = customInput.value.trim();
        if (!exName) continue;
        const { data: newLib, error: libErr } = await supabaseClient
          .from("exercise_library")
          .insert({ user_id: currentUser.id, name: exName, muscle_group: "Perso" })
          .select().single();
        if (libErr){ alert("Erreur création exercice : " + libErr.message); continue; }
        libraryId = newLib.id;
        EXERCISE_LIBRARY.push(newLib);
      } else if (select.value){
        libraryId = select.value;
        const found = EXERCISE_LIBRARY.find(e => e.id === libraryId);
        exName = found ? found.name : "Exercice";
      } else {
        continue;
      }

      const workingCount = plan.working.filter(s => s.reps || s.weight).length || plan.working.length;
      const firstWorking = plan.working[0] || {};

      exercisesToInsert.push({
        workout_id: workout.id,
        exercise_library_id: libraryId,
        name: exName,
        sets: workingCount || null,
        reps: firstWorking.reps ? parseInt(firstWorking.reps) : null,
        rest_seconds: plan.rest || 90,
        position: exercisesToInsert.length,
        done: false
      });
      rowIdByIndex.push(rowId);
    }

    if (exercisesToInsert.length){
      const { data: insertedExercises, error: exoError } = await supabaseClient
        .from("exercises").insert(exercisesToInsert).select();
      if (exoError){
        alert("Séance créée, mais erreur sur les exercices : " + exoError.message);
      } else {
        const setsToInsert = [];
        insertedExercises.forEach((ex, idx) => {
          const plan = plannedSetsByRow[rowIdByIndex[idx]];
          if (!plan) return;
          plan.warmup.forEach((s, i) => {
            setsToInsert.push({
              exercise_id: ex.id, set_number: i + 1, is_warmup: true,
              weight_kg: s.weight !== "" ? parseFloat(s.weight) : null,
              reps: s.reps !== "" ? parseInt(s.reps) : null,
              completed: false
            });
          });
          plan.working.forEach((s, i) => {
            setsToInsert.push({
              exercise_id: ex.id, set_number: i + 1, is_warmup: false,
              weight_kg: s.weight !== "" ? parseFloat(s.weight) : null,
              reps: s.reps !== "" ? parseInt(s.reps) : null,
              completed: false
            });
          });
        });
        if (setsToInsert.length){
          const { error: setsError } = await supabaseClient.from("workout_sets").insert(setsToInsert);
          if (setsError) alert("Séance créée, mais erreur sur les séries planifiées : " + setsError.message);
        }
      }
    }

    closeWorkoutModal();
    loadSport();
  }

  // ---------- MODE LIVE ----------
  let live = null;

  function formatTime(sec){
    sec = Math.max(0, Math.round(sec));
    const m = Math.floor(sec / 60), s = sec % 60;
    return `${m}:${String(s).padStart(2, "0")}`;
  }

  async function launchLiveSession(){
    if (!currentWorkoutExercises.length){
      alert("Ajoute au moins un exercice à cette séance avant de la démarrer.");
      return;
    }

    const exercisesData = [];
    for (const ex of currentWorkoutExercises){
      const { data: existingSets } = await supabaseClient
        .from("workout_sets").select("*").eq("exercise_id", ex.id)
        .order("is_warmup", { ascending: false })
        .order("set_number", { ascending: true });

      let loggedSets;
      if (existingSets && existingSets.length){
        loggedSets = existingSets.map(s => ({
          set_number: s.set_number, weight_kg: s.weight_kg, reps: s.reps,
          completed: !!s.completed, dbId: s.id, isWarmup: !!s.is_warmup
        }));
      } else {
        loggedSets = Array.from({ length: Math.max(ex.sets || 1, 1) }, (_, i) => ({
          set_number: i + 1, weight_kg: null, reps: ex.reps || null, completed: false, dbId: null, isWarmup: false
        }));
      }
      exercisesData.push({ id: ex.id, name: ex.name, rest_seconds: ex.rest_seconds || 90, loggedSets });
    }

    live = {
      workout: currentWorkout,
      exercises: exercisesData,
      currentExoIndex: 0,
      phase: "log",
      startTime: new Date(),
      timer: null, restRemaining: 0, restTotal: 0
    };
    document.getElementById("live-overlay").classList.add("open");
    renderLiveBody();
  }

  async function saveSet(exo, setIdx){
    const s = exo.loggedSets[setIdx];
    if (s.dbId){
      await supabaseClient.from("workout_sets")
        .update({ weight_kg: s.weight_kg, reps: s.reps, completed: true, completed_at: new Date().toISOString() })
        .eq("id", s.dbId);
    } else {
      const { data } = await supabaseClient.from("workout_sets")
        .insert({ exercise_id: exo.id, set_number: s.set_number, is_warmup: !!s.isWarmup, weight_kg: s.weight_kg, reps: s.reps, completed: true, completed_at: new Date().toISOString() })
        .select().single();
      if (data) s.dbId = data.id;
    }
  }

  function validateSet(setIdx){
    const exo = live.exercises[live.currentExoIndex];
    const row = document.getElementById("set-row-" + setIdx);
    const weight = parseFloat(row.querySelector(".set-weight").value) || null;
    const reps = parseInt(row.querySelector(".set-reps").value) || null;
    exo.loggedSets[setIdx].weight_kg = weight;
    exo.loggedSets[setIdx].reps = reps;
    exo.loggedSets[setIdx].completed = true;
    saveSet(exo, setIdx);

    const isLastSetOfLastExo =
      (live.currentExoIndex === live.exercises.length - 1) &&
      (setIdx === exo.loggedSets.length - 1);

    if (isLastSetOfLastExo){
      goToSummary();
    } else {
      startRest(exo.rest_seconds || 90, setIdx);
    }
  }

  function startRest(seconds, justCompletedSetIdx){
    live.phase = "rest";
    live.restTotal = seconds;
    live.restRemaining = seconds;
    live.pendingSetIdx = justCompletedSetIdx;
    renderLiveBody();
    live.timer = setInterval(() => {
      live.restRemaining--;
      updateRestUI();
      if (live.restRemaining <= 0){
        clearInterval(live.timer);
        finishRest();
      }
    }, 1000);
  }

  function updateRestUI(){
    const disp = document.getElementById("rest-time-display");
    const bar = document.getElementById("rest-bar-fill");
    if (disp) disp.textContent = formatTime(live.restRemaining);
    if (bar) bar.style.width = Math.max(0, (live.restRemaining / live.restTotal) * 100) + "%";
  }

  function addRestTime(sec){
    live.restRemaining += sec; live.restTotal += sec;
    updateRestUI();
  }

  function skipRest(){
    clearInterval(live.timer);
    finishRest();
  }

  function finishRest(){
    const exo = live.exercises[live.currentExoIndex];
    const nextSetIdx = live.pendingSetIdx + 1;
    if (nextSetIdx < exo.loggedSets.length){
      live.phase = "log";
      renderLiveBody();
    } else if (live.currentExoIndex < live.exercises.length - 1){
      live.currentExoIndex++;
      live.phase = "log";
      renderLiveBody();
    } else {
      goToSummary();
    }
  }

  function skipToNextExercise(){
    if (live.currentExoIndex < live.exercises.length - 1){
      live.currentExoIndex++;
      live.phase = "log";
      renderLiveBody();
    } else {
      goToSummary();
    }
  }

  function goToSummary(){
    if (live.timer) clearInterval(live.timer);
    live.phase = "summary";
    renderLiveBody();
  }

  function confirmExitLive(){
    if (confirm("Quitter la séance ? Les séries déjà validées restent enregistrées.")){
      if (live.timer) clearInterval(live.timer);
      document.getElementById("live-overlay").classList.remove("open");
      loadSport();
    }
  }

  async function finishWorkout(){
    const duration = parseInt(document.getElementById("summary-duration").value) || null;
    const calories = parseInt(document.getElementById("summary-calories").value) || null;
    await supabaseClient.from("workouts")
      .update({ completed: true, duration_min: duration, calories_burned: calories })
      .eq("id", live.workout.id);
    document.getElementById("live-overlay").classList.remove("open");
    loadSport();
  }

  function renderLiveBody(){
    const progressLbl = document.getElementById("live-progress-lbl");
    const body = document.getElementById("live-body");
    const footer = document.getElementById("live-footer");

    if (live.phase === "summary"){
      progressLbl.textContent = "Résumé";
      const elapsedMin = Math.max(1, Math.round((new Date() - live.startTime) / 60000));
      body.innerHTML = `
        <div class="live-summary">
          <div class="emoji">🎉</div>
          <h2>Séance terminée !</h2>
          <p>Beau travail. Vérifie les derniers détails avant d'enregistrer.</p>
          <div class="modal-field"><label>Durée (min)</label><input type="number" id="summary-duration" value="${elapsedMin}"></div>
          <div class="modal-field"><label>Kcal brûlées (estimation)</label><input type="number" id="summary-calories" value="${live.workout.calories_burned || ""}" placeholder="300"></div>
        </div>`;
      footer.innerHTML = `<button class="live-next-btn" onclick="finishWorkout()">Enregistrer et terminer</button>`;
      return;
    }

    const exo = live.exercises[live.currentExoIndex];
    progressLbl.textContent = `Exercice ${live.currentExoIndex + 1}/${live.exercises.length}`;

    if (live.phase === "rest"){
      body.innerHTML = `
        <div class="live-exo-name">${exo.name}</div>
        <div class="live-exo-meta">Repos avant la série suivante</div>
        <div class="rest-card">
          <div class="rest-label">Temps de repos</div>
          <div class="rest-time" id="rest-time-display">${formatTime(live.restRemaining)}</div>
          <div class="rest-bar-track"><div class="rest-bar-fill" id="rest-bar-fill" style="width:${(live.restRemaining / live.restTotal) * 100}%"></div></div>
          <div class="rest-actions">
            <button class="rest-btn add" onclick="addRestTime(15)">+15s</button>
            <button class="rest-btn skip" onclick="skipRest()">Passer le repos</button>
          </div>
        </div>`;
      footer.innerHTML = "";
      return;
    }

    const setsHtml = exo.loggedSets.map((s, i) => `
      <div class="set-row ${s.completed ? "done" : ""}" id="set-row-${i}">
        <div class="set-num">${s.isWarmup ? "É" + (s.set_number ?? i + 1) : (s.set_number ?? i + 1)}</div>
        <div class="set-input-group">
          <div class="grp"><span class="u">kg</span><input type="number" class="set-weight" step="0.5" value="${s.weight_kg ?? ""}" ${s.completed ? "disabled" : ""}></div>
          <div class="grp"><span class="u">reps</span><input type="number" class="set-reps" value="${s.reps ?? ""}" ${s.completed ? "disabled" : ""}></div>
        </div>
        <button type="button" class="set-validate ${s.completed ? "done" : ""}" onclick="validateSet(${i})" ${s.completed ? "disabled" : ""}>
          ${s.completed
            ? '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#12161B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'
            : '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'}
        </button>
      </div>`).join("");

    body.innerHTML = `
      <div class="live-exo-name">${exo.name}</div>
      <div class="live-exo-meta">${exo.loggedSets.length} séries cibles · ${exo.rest_seconds}s de repos</div>
      ${setsHtml}`;

    const isLast = live.currentExoIndex === live.exercises.length - 1;
    footer.innerHTML = `<button class="live-next-btn" onclick="${isLast ? "goToSummary()" : "skipToNextExercise()"}">${isLast ? "Terminer la séance" : "Passer à l'exercice suivant"}</button>`;
  }

  function renderWeekBars(workouts){
    const weekStart = startOfWeek();
    const totals = [0,0,0,0,0,0,0]; // minutes par jour, lundi -> dimanche
    workouts.forEach(w => {
      if (!w.completed || !w.scheduled_at) return;
      const d = new Date(w.scheduled_at);
      const dayIdx = Math.floor((d - weekStart) / 86400000);
      if (dayIdx >= 0 && dayIdx < 7) totals[dayIdx] += (w.duration_min || 0);
    });

    const max = Math.max(60, ...totals);
    const todayIdx = Math.floor((new Date() - weekStart) / 86400000);
    const container = document.getElementById("week-bars");
    container.innerHTML = "";
    totals.forEach((min, i) => {
      const isToday = i === todayIdx;
      const pct = Math.min(100, (min / max) * 100);
      const col = document.createElement("div");
      col.className = "bar-col" + (isToday ? " today" : "");
      col.innerHTML = `<div class="bar-track"><div class="bar-fill" style="height:${pct}%"></div></div><div class="d">${DAY_LABELS[i]}</div>`;
      container.appendChild(col);
    });

    const totalMin = totals.reduce((s, m) => s + m, 0);
    document.getElementById("week-total").textContent = `${Math.floor(totalMin / 60)}h ${totalMin % 60} min`;
  }

  async function viewWorkoutDetail(workoutId){
    const overlay = document.getElementById("detail-overlay");
    const body = document.getElementById("detail-body");
    body.innerHTML = `<div class="detail-empty">Chargement…</div>`;
    overlay.classList.add("open");

    const { data: workout } = await supabaseClient.from("workouts").select("*").eq("id", workoutId).single();
    const { data: exercises } = await supabaseClient
      .from("exercises").select("*").eq("workout_id", workoutId).order("position", { ascending: true });

    if (!workout || !exercises || !exercises.length){
      document.getElementById("detail-title").textContent = workout ? workout.name : "Séance";
      body.innerHTML = `<div class="detail-empty">Aucun exercice enregistré pour cette séance.</div>`;
      return;
    }

    const exerciseIds = exercises.map(e => e.id);
    const { data: sets } = await supabaseClient
      .from("workout_sets").select("*").in("exercise_id", exerciseIds).order("set_number", { ascending: true });

    // Records personnels : poids max jamais loggé, par nom d'exercice (toutes séances confondues)
    const { data: allSets } = await supabaseClient
      .from("workout_sets")
      .select("weight_kg, exercises!inner(name, workouts!inner(user_id))")
      .eq("exercises.workouts.user_id", currentUser.id);

    const recordsByName = {};
    (allSets || []).forEach(s => {
      const name = s.exercises?.name;
      if (!name || s.weight_kg == null) return;
      if (!recordsByName[name] || s.weight_kg > recordsByName[name]) recordsByName[name] = s.weight_kg;
    });

    document.getElementById("detail-title").textContent = workout.name;

    let totalVolume = 0, totalSets = 0;
    let html = `<div class="detail-summary">
      <div class="item"><div class="v">${workout.duration_min || "?"}</div><div class="k">Minutes</div></div>
      <div class="item"><div class="v">${workout.calories_burned || "?"}</div><div class="k">Kcal brûlées</div></div>
      <div class="item"><div class="v" id="detail-volume">—</div><div class="k">Volume total (kg)</div></div>
    </div>`;

    exercises.forEach(ex => {
      const exoSets = (sets || []).filter(s => s.exercise_id === ex.id);
      html += `<div class="detail-exo"><div class="detail-exo-name">${ex.name}</div>`;
      if (!exoSets.length){
        html += `<div class="detail-empty" style="padding:8px 0;">Pas de série loggée en mode live.</div>`;
      } else {
        exoSets.forEach(s => {
          const isRecord = s.weight_kg != null && recordsByName[ex.name] === s.weight_kg && s.weight_kg > 0;
          if (s.weight_kg != null && s.reps != null) totalVolume += s.weight_kg * s.reps;
          totalSets++;
          html += `<div class="detail-set-row">
            <div class="detail-set-num">#${s.set_number}</div>
            <div class="detail-set-val">${s.weight_kg != null ? s.weight_kg + " kg" : "—"} × ${s.reps != null ? s.reps + " reps" : "—"}</div>
            ${isRecord ? '<div class="detail-set-record">🏆 Record</div>' : ''}
          </div>`;
        });
      }
      html += `</div>`;
    });

    body.innerHTML = html;
    const volEl = document.getElementById("detail-volume");
    if (volEl) volEl.textContent = totalSets ? Math.round(totalVolume).toLocaleString("fr-FR") : "—";
  }

  function closeDetailOverlay(){
    document.getElementById("detail-overlay").classList.remove("open");
  }

  function renderHistory(workouts){
    const completed = workouts
      .filter(w => w.completed)
      .sort((a, b) => new Date(b.scheduled_at || b.created_at) - new Date(a.scheduled_at || a.created_at))
      .slice(0, 5);

    const container = document.getElementById("history-list");
    if (!completed.length){
      container.innerHTML = `<div class="history-item"><div class="history-meta"><div class="history-name">Pas encore de séance terminée</div></div></div>`;
      return;
    }
    container.innerHTML = "";
    completed.forEach(w => {
      const date = w.scheduled_at ? new Date(w.scheduled_at).toLocaleDateString("fr-FR", { weekday: "long" }) : "";
      const el = document.createElement("div");
      el.className = "history-item";
      el.style.cursor = "pointer";
      el.onclick = () => viewWorkoutDetail(w.id);
      el.innerHTML = `
        <div class="history-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6FA8FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="9" width="2.3" height="6" rx="1"/><rect x="4.3" y="7" width="2" height="10" rx="1"/><line x1="7.3" y1="12" x2="16.7" y2="12"/><rect x="17.7" y="7" width="2" height="10" rx="1"/><rect x="20.2" y="9" width="2.3" height="6" rx="1"/></svg></div>
        <div class="history-meta">
          <div class="history-name">${w.name}</div>
          <div class="history-date">${date}</div>
        </div>
        <div class="history-dur">${w.duration_min || "?"} min</div>
        <div class="history-actions">
          <button class="history-duplicate" onclick="event.stopPropagation(); duplicateWorkout('${w.id}')" title="Dupliquer">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          </button>
          <button class="history-edit" onclick="event.stopPropagation(); editWorkout('${w.id}')" title="Modifier">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg>
          </button>
          <button class="history-delete" onclick="event.stopPropagation(); deleteWorkout('${w.id}')" title="Supprimer">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>
          </button>
        </div>`;
      container.appendChild(el);
    });
  }

  async function loadSport(){
    const user = await requireAuth();
    if (!user) return;

    document.getElementById("sport-date").textContent =
      new Date().toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });

    const { data: profile } = await supabaseClient
      .from("profiles").select("weekly_workout_goal").eq("id", user.id).single();
    const weeklyGoal = profile?.weekly_workout_goal || 4;

    const { data: weekWorkouts } = await supabaseClient
      .from("workouts").select("*")
      .eq("user_id", user.id)
      .gte("scheduled_at", startOfWeek().toISOString())
      .lte("scheduled_at", endOfWeek().toISOString());

    const list = weekWorkouts || [];
    renderWeekBars(list);
    const completedCount = list.filter(w => w.completed).length;
    document.getElementById("completed-count").textContent = `${completedCount}/${weeklyGoal}`;
    document.getElementById("completed-label").textContent =
      completedCount >= weeklyGoal ? "Objectif atteint 🎉" : "Séances complétées";
    document.getElementById("burned-total").textContent =
      list.filter(w => w.completed).reduce((s, w) => s + (w.calories_burned || 0), 0).toLocaleString("fr-FR");
    renderHistory(list);

    await renderTodayWorkout(user);
  }

  (async function init(){
    await loadExerciseLibrary();
    await loadSport();
  })();
</script>
</body>
</html>
