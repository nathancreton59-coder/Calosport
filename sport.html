<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Sport — Suivi fitness</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg: #12161B;
    --surface: #1B2128;
    --text: #F2F0EA;
    --text-muted: #8A93A0;
    --line: #2A323B;

    --lime: #D4F252;
    --lime-dim: #3A4420;
    --flame: #FF7A59;
    --flame-dim: #3D2620;
    --volt: #6FA8FF;
    --volt-dim: #202B3D;
  }

  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0;
    background:#0A0C0F;
    font-family:'Inter', sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  body{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding: 32px 12px;
  }

  .device{
    width: 390px; height: 844px;
    background: var(--bg);
    border-radius: 44px;
    border: 1px solid #262d35;
    box-shadow: 0 40px 80px -20px rgba(0,0,0,0.6), 0 0 0 8px #05070a;
    overflow: hidden;
    position: relative;
    display:flex; flex-direction: column;
  }

  .statusbar{
    display:flex; justify-content:space-between; align-items:center;
    padding: 18px 28px 6px;
    font-size: 14px; font-weight:600; color: var(--text);
    flex-shrink:0;
  }
  .statusbar .dots{ display:flex; gap:5px; align-items:center; }
  .statusbar .dots span{ width:4px; height:4px; border-radius:50%; background: var(--text); display:inline-block; }

  .content{
    flex:1; overflow-y:auto; padding: 4px 24px 130px;
  }
  .content::-webkit-scrollbar{ display:none; }

  .page-header{
    display:flex; align-items:center; justify-content:space-between;
    margin: 12px 0 18px;
  }
  .page-title{ font-family:'Unbounded'; font-weight:700; font-size:22px; }
  .page-header .date{ font-size:12px; color:var(--text-muted); margin-top:2px; }
  .goal-btn{
    width:38px; height:38px; border-radius:13px;
    background: var(--surface); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
  }

  /* semaine — barres d'activite (signature) */
  .week-card{
    background: linear-gradient(165deg, var(--surface) 0%, #171C22 100%);
    border: 1px solid var(--line);
    border-radius: 28px;
    padding: 22px 20px 18px;
    margin-bottom: 18px;
  }
  .week-top{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:16px; }
  .week-top .t{ font-weight:700; font-size:14.5px; }
  .week-top .v{ font-family:'Unbounded'; font-weight:700; font-size:15px; color: var(--volt); }

  .bars{ display:flex; align-items:flex-end; justify-content:space-between; height:88px; padding:0 2px; }
  .bar-col{ display:flex; flex-direction:column; align-items:center; gap:8px; width:26px; }
  .bar-track{
    width: 10px; height:64px; border-radius:6px; background:#2A323B;
    display:flex; align-items:flex-end; overflow:hidden;
  }
  .bar-fill{ width:100%; border-radius:6px; background: var(--volt); }
  .bar-col.today .bar-fill{ background: var(--lime); box-shadow: 0 0 8px rgba(212,242,82,0.4); }
  .bar-col .d{ font-size:10.5px; color: var(--text-muted); font-weight:600; }
  .bar-col.today .d{ color: var(--lime); }

  /* stats rapides */
  .section-title{
    font-size: 12px; letter-spacing:0.1em; text-transform:uppercase;
    color: var(--text-muted); font-weight:700; margin: 6px 0 12px;
  }
  .stat-row{ display:flex; gap: 12px; margin-bottom: 6px; }
  .stat-card{
    flex:1; background: var(--surface); border:1px solid var(--line);
    border-radius: 20px; padding: 16px;
  }
  .stat-icon{
    width:34px; height:34px; border-radius: 11px; background: var(--volt-dim);
    display:flex; align-items:center; justify-content:center; margin-bottom: 12px;
  }
  .stat-value{ font-family:'Unbounded'; font-weight:700; font-size:18px; }
  .stat-label{ font-size:11.5px; color:var(--text-muted); margin-top:3px; }

  /* seance du jour */
  .workout-hero{
    margin-top: 18px;
    background: linear-gradient(150deg, var(--volt-dim) 0%, #171C22 65%);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 20px;
    position: relative;
    overflow:hidden;
  }
  .workout-hero .eyebrow{
    font-size:11px; letter-spacing:0.1em; text-transform:uppercase;
    color: var(--volt); font-weight:700; margin-bottom:6px;
  }
  .workout-hero .title{ font-family:'Unbounded'; font-weight:700; font-size:19px; margin-bottom:6px; }
  .workout-hero .meta{ font-size:12.5px; color:var(--text-muted); }
  .start-btn{
    margin-top:16px; width:100%; border:none; border-radius:16px;
    background: var(--lime); color:#12161B; font-family:'Inter'; font-weight:700;
    font-size:14px; padding:14px; display:flex; align-items:center; justify-content:center; gap:8px;
  }

  /* liste exercices */
  .exo-item{
    display:flex; align-items:center; gap:12px;
    background: var(--surface); border:1px solid var(--line);
    border-radius:18px; padding:12px 14px; margin-bottom:8px;
  }
  .exo-num{
    width:30px; height:30px; border-radius:10px; background: var(--volt-dim);
    color: var(--volt); font-family:'Unbounded'; font-size:12px; font-weight:700;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .exo-meta{ flex:1; }
  .exo-name{ font-weight:600; font-size:13.5px; }
  .exo-detail{ font-size:11.5px; color:var(--text-muted); margin-top:2px; }
  .exo-check{
    width:26px; height:26px; border-radius:50%; border:1.5px solid var(--line);
    flex-shrink:0;
  }
  .exo-check.done{
    background: var(--lime); border-color: var(--lime);
    display:flex; align-items:center; justify-content:center;
  }

  /* historique */
  .history-item{
    display:flex; align-items:center; gap:12px;
    padding: 12px 2px; border-bottom: 1px solid var(--line);
  }
  .history-item:last-child{ border-bottom:none; }
  .history-icon{
    width:36px; height:36px; border-radius:12px; background: var(--volt-dim);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .history-meta{ flex:1; }
  .history-name{ font-weight:600; font-size:13px; }
  .history-date{ font-size:11.5px; color:var(--text-muted); margin-top:2px; }
  .history-dur{ font-size:12.5px; color:var(--text-muted); font-weight:600; }

  /* bottom nav (identique) */
  .navbar{
    position:absolute; left:0; right:0; bottom:0; height:108px;
    background: linear-gradient(180deg, rgba(18,22,27,0) 0%, var(--bg) 30%);
    display:flex; align-items:flex-end; justify-content:center; padding-bottom:26px;
  }
  .nav-pill{
    width:300px; height:66px;
    background: rgba(27,33,40,0.9); backdrop-filter: blur(14px);
    border:1px solid var(--line); border-radius:33px;
    display:flex; align-items:center; justify-content:space-between;
    padding: 0 22px; position:relative;
  }
  .nav-item{
    display:flex; flex-direction:column; align-items:center; gap:4px;
    color: var(--text-muted); width:44px; position:relative;
    text-decoration:none; cursor:pointer;
  }
  .nav-item .lbl{ font-size:10px; font-weight:600; }
  .nav-item.cal{ color: var(--flame); }
  .nav-item.sport{ color: var(--volt); }
  .nav-item.active .chip{
    position:absolute; top:-8px; left:50%; transform:translateX(-50%);
    width:34px; height:34px; border-radius:11px; z-index:-1;
  }
  .nav-item.sport.active .chip{ background: var(--volt-dim); }

  .nav-home{
    position:absolute; left:50%; top:-26px; transform:translateX(-50%);
    width:64px; height:64px; border-radius:50%;
    background: var(--lime);
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 8px 24px rgba(212,242,82,0.2), 0 0 0 6px var(--bg);
    text-decoration:none; cursor:pointer;
  }
  .nav-home-label{
    position:absolute; left:50%; transform:translateX(-50%);
    top:40px; font-size:10px; font-weight:700; color: var(--text-muted);
    white-space:nowrap;
  }
</style>
</head>
<body>

<div class="device">

  <div class="statusbar">
    <span>9:41</span>
    <div class="dots"><span></span><span></span><span></span></div>
  </div>

  <div class="content">
    <div class="page-header">
      <div>
        <div class="page-title">Sport</div>
        <div class="date" id="sport-date">—</div>
      </div>
      <div class="goal-btn" onclick="logout()" title="Se déconnecter" style="cursor:pointer;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8A93A0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      </div>
    </div>

    <div class="week-card">
      <div class="week-top">
        <div class="t">Activité de la semaine</div>
        <div class="v" id="week-total">—</div>
      </div>
      <div class="bars" id="week-bars"></div>
    </div>

    <div class="section-title">Cette semaine</div>
    <div class="stat-row">
      <div class="stat-card">
        <div class="stat-icon">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6FA8FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5 17.5 17.5M4 9l3-3 3 3-3 3-3-3zM17 12l3 3-3 3-3-3 3-3z"/></svg>
        </div>
        <div class="stat-value" id="completed-count">—</div>
        <div class="stat-label">Séances complétées</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6FA8FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c1 3-2 4-2 7a4 4 0 0 0 8 0c0-1-.5-2-1-2 .5 2-1 3-2 2 1-2-1-3-1-5 0-1 .5-2 1-3-2 0-3.5 1-3 3-2 0-3 2-3 4a6 6 0 0 0 6 6"/></svg>
        </div>
        <div class="stat-value" id="burned-total">—</div>
        <div class="stat-label">Kcal brûlées</div>
      </div>
    </div>

    <div class="section-title">Séance du jour</div>
    <div id="workout-hero-container">
      <div class="workout-hero"><div class="title">Chargement…</div></div>
    </div>

    <div style="margin-top:16px;" id="exo-list"></div>

    <div class="section-title">Historique récent</div>
    <div id="history-list"><div class="history-item"><div class="history-meta"><div class="history-name">Chargement…</div></div></div></div>

  </div>

  <div class="navbar">
    <div class="nav-pill">
      <a class="nav-item cal" href="calories.html">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c1 3-2 4-2 7a4 4 0 0 0 8 0c0-1-.5-2-1-2 .5 2-1 3-2 2 1-2-1-3-1-5 0-1 .5-2 1-3-2 0-3.5 1-3 3-2 0-3 2-3 4a6 6 0 0 0 6 6"/></svg>
        <span class="lbl">Calories</span>
      </a>

      <div style="width:64px;"></div>

      <a class="nav-item sport active" href="sport.html">
        <div class="chip"></div>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5 17.5 17.5M4 9l3-3 3 3-3 3-3-3zM17 12l3 3-3 3-3-3 3-3z"/></svg>
        <span class="lbl">Sport</span>
      </a>
    </div>

    <a class="nav-home" href="index.html">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#12161B" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
    </a>
    <div class="nav-home-label">Accueil</div>
  </div>

</div>

<script src="config.js"></script>
<script src="auth-guard.js"></script>
<script>
  const DAY_LABELS = ["L", "M", "M", "J", "V", "S", "D"];
  let activeWorkoutId = null;

  function endOfWeek(){
    const d = startOfWeek();
    d.setDate(d.getDate() + 7);
    d.setMilliseconds(-1);
    return d;
  }

  async function toggleExercise(exoId, currentlyDone){
    await supabaseClient.from("exercises").update({ done: !currentlyDone }).eq("id", exoId);
    loadSport();
  }

  async function startWorkout(workoutId){
    await supabaseClient.from("workouts").update({ completed: true }).eq("id", workoutId);
    loadSport();
  }

  function renderWeekBars(workouts){
    const weekStart = startOfWeek();
    const totals = [0,0,0,0,0,0,0]; // minutes par jour, lundi -> dimanche
    workouts.forEach(w => {
      if (!w.completed || !w.scheduled_at) return;
      const d = new Date(w.scheduled_at);
      const dayIdx = Math.floor((d - weekStart) / 86400000);
      if (dayIdx >= 0 && dayIdx < 7) totals[dayIdx] += (w.duration_min || 0);
    });

    const max = Math.max(60, ...totals);
    const todayIdx = Math.floor((new Date() - weekStart) / 86400000);
    const container = document.getElementById("week-bars");
    container.innerHTML = "";
    totals.forEach((min, i) => {
      const isToday = i === todayIdx;
      const pct = Math.min(100, (min / max) * 100);
      const col = document.createElement("div");
      col.className = "bar-col" + (isToday ? " today" : "");
      col.innerHTML = `<div class="bar-track"><div class="bar-fill" style="height:${pct}%"></div></div><div class="d">${DAY_LABELS[i]}</div>`;
      container.appendChild(col);
    });

    const totalMin = totals.reduce((s, m) => s + m, 0);
    document.getElementById("week-total").textContent = `${Math.floor(totalMin / 60)}h ${totalMin % 60} min`;
  }

  function renderHistory(workouts){
    const completed = workouts
      .filter(w => w.completed)
      .sort((a, b) => new Date(b.scheduled_at || b.created_at) - new Date(a.scheduled_at || a.created_at))
      .slice(0, 5);

    const container = document.getElementById("history-list");
    if (!completed.length){
      container.innerHTML = `<div class="history-item"><div class="history-meta"><div class="history-name">Pas encore de séance terminée</div></div></div>`;
      return;
    }
    container.innerHTML = "";
    completed.forEach(w => {
      const date = w.scheduled_at ? new Date(w.scheduled_at).toLocaleDateString("fr-FR", { weekday: "long" }) : "";
      const el = document.createElement("div");
      el.className = "history-item";
      el.innerHTML = `
        <div class="history-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6FA8FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5 17.5 17.5M4 9l3-3 3 3-3 3-3-3zM17 12l3 3-3 3-3-3 3-3z"/></svg></div>
        <div class="history-meta">
          <div class="history-name">${w.name}</div>
          <div class="history-date">${date}</div>
        </div>
        <div class="history-dur">${w.duration_min || "?"} min</div>`;
      container.appendChild(el);
    });
  }

  async function renderTodayWorkout(user){
    const { data: todays } = await supabaseClient
      .from("workouts").select("*")
      .eq("user_id", user.id)
      .eq("completed", false)
      .gte("scheduled_at", startOfToday().toISOString())
      .lte("scheduled_at", endOfToday().toISOString())
      .order("scheduled_at", { ascending: true })
      .limit(1)
      .maybeSingle();

    const heroContainer = document.getElementById("workout-hero-container");
    const exoContainer = document.getElementById("exo-list");

    if (!todays){
      heroContainer.innerHTML = `
        <div class="workout-hero">
          <div class="eyebrow">Aujourd'hui</div>
          <div class="title">Aucune séance planifiée</div>
          <div class="meta">Ajoute une séance pour aujourd'hui depuis Supabase ou ton futur écran de création.</div>
        </div>`;
      exoContainer.innerHTML = "";
      return;
    }

    activeWorkoutId = todays.id;
    const time = todays.scheduled_at ? new Date(todays.scheduled_at).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }) : "";

    const { data: exercises } = await supabaseClient
      .from("exercises").select("*")
      .eq("workout_id", todays.id)
      .order("position", { ascending: true });

    heroContainer.innerHTML = `
      <div class="workout-hero">
        <div class="eyebrow">${todays.workout_type || "Séance"}</div>
        <div class="title">${todays.name}</div>
        <div class="meta">${time} · ${todays.duration_min || "?"} min · ${(exercises || []).length} exercices</div>
        <button class="start-btn" onclick="startWorkout('${todays.id}')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="#12161B"><path d="M8 5v14l11-7z"/></svg>
          Marquer la séance comme terminée
        </button>
      </div>`;

    exoContainer.innerHTML = "";
    (exercises || []).forEach((ex, i) => {
      const el = document.createElement("div");
      el.className = "exo-item";
      el.innerHTML = `
        <div class="exo-num">${String(i + 1).padStart(2, "0")}</div>
        <div class="exo-meta">
          <div class="exo-name">${ex.name}</div>
          <div class="exo-detail">${ex.sets || "?"} séries × ${ex.reps || "?"} reps</div>
        </div>
        <div class="exo-check ${ex.done ? "done" : ""}" onclick="toggleExercise('${ex.id}', ${ex.done})">
          ${ex.done ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#12161B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>' : ""}
        </div>`;
      exoContainer.appendChild(el);
    });
  }

  async function loadSport(){
    const user = await requireAuth();
    if (!user) return;

    document.getElementById("sport-date").textContent =
      new Date().toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });

    const { data: weekWorkouts } = await supabaseClient
      .from("workouts").select("*")
      .eq("user_id", user.id)
      .gte("scheduled_at", startOfWeek().toISOString())
      .lte("scheduled_at", endOfWeek().toISOString());

    const list = weekWorkouts || [];
    renderWeekBars(list);
    document.getElementById("completed-count").textContent = list.filter(w => w.completed).length;
    document.getElementById("burned-total").textContent =
      list.filter(w => w.completed).reduce((s, w) => s + (w.calories_burned || 0), 0).toLocaleString("fr-FR");
    renderHistory(list);

    await renderTodayWorkout(user);
  }

  loadSport();
</script>
</body>
</html>
