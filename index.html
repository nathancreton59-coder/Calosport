<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Accueil — Suivi fitness</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg: #12161B;
    --surface: #1B2128;
    --surface-2: #222A32;
    --text: #F2F0EA;
    --text-muted: #8A93A0;
    --line: #2A323B;

    --lime: #D4F252;      /* signature — accueil / énergie du jour */
    --lime-dim: #3A4420;
    --flame: #FF7A59;     /* calories */
    --flame-dim: #3D2620;
    --volt: #6FA8FF;      /* sport */
    --volt-dim: #202B3D;
  }

  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0;
    background: #0A0C0F;
    font-family: 'Inter', sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 32px 12px;
  }

  .device{
    width: 390px;
    height: 844px;
    background: var(--bg);
    border-radius: 44px;
    border: 1px solid #262d35;
    box-shadow: 0 40px 80px -20px rgba(0,0,0,0.6), 0 0 0 8px #05070a;
    overflow: hidden;
    position: relative;
    display:flex;
    flex-direction: column;
  }

  /* ---------- status bar ---------- */
  .statusbar{
    display:flex; justify-content:space-between; align-items:center;
    padding: 18px 28px 6px;
    font-size: 14px; font-weight:600; color: var(--text);
    flex-shrink:0;
  }
  .statusbar .dots{ display:flex; gap:5px; align-items:center; }
  .statusbar .dots span{ width:4px; height:4px; border-radius:50%; background: var(--text); display:inline-block; }

  /* ---------- content ---------- */
  .content{
    flex:1;
    overflow-y:auto;
    padding: 8px 24px 130px;
  }
  .content::-webkit-scrollbar{ display:none; }

  .greeting-eyebrow{
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-muted);
    font-weight: 600;
    margin: 10px 0 2px;
  }
  .greeting{
    font-family:'Unbounded', sans-serif;
    font-weight: 700;
    font-size: 26px;
    line-height: 1.15;
    margin: 0 0 22px;
  }
  .greeting span{ color: var(--lime); }

  /* ---------- ring energie du jour (signature) ---------- */
  .today-card{
    background: linear-gradient(165deg, var(--surface) 0%, #171C22 100%);
    border: 1px solid var(--line);
    border-radius: 28px;
    padding: 22px;
    display:flex;
    align-items:center;
    gap: 20px;
    margin-bottom: 16px;
  }
  .ring-wrap{ position:relative; width:112px; height:112px; flex-shrink:0; }
  .ring-wrap svg{ transform: rotate(-90deg); }
  .ring-bg{ fill:none; stroke: #2A323B; stroke-width: 10; }
  .ring-fg{
    fill:none; stroke: var(--lime); stroke-width: 10; stroke-linecap: round;
    stroke-dasharray: 314; stroke-dashoffset: 110;
    filter: drop-shadow(0 0 6px rgba(212,242,82,0.45));
  }
  .ring-center{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
  }
  .ring-center .num{ font-family:'Unbounded'; font-weight:700; font-size:20px; }
  .ring-center .lbl{ font-size:10px; color:var(--text-muted); margin-top:2px; }

  .today-info{ flex:1; }
  .today-info .title{ font-weight:700; font-size:15px; margin-bottom:6px; }
  .today-info .sub{ font-size:12.5px; color: var(--text-muted); line-height:1.5; }
  .today-info .sub b{ color: var(--text); font-weight:600; }

  /* ---------- section title ---------- */
  .section-title{
    font-size: 12px; letter-spacing:0.1em; text-transform:uppercase;
    color: var(--text-muted); font-weight:700; margin: 22px 0 12px;
  }

  /* ---------- deux cartes stats ---------- */
  .stat-row{ display:flex; gap: 12px; margin-bottom: 6px; }
  .stat-card{
    flex:1;
    background: var(--surface);
    border:1px solid var(--line);
    border-radius: 20px;
    padding: 16px;
  }
  .stat-icon{
    width:34px; height:34px; border-radius: 11px;
    display:flex; align-items:center; justify-content:center;
    margin-bottom: 12px;
  }
  .stat-card.cal .stat-icon{ background: var(--flame-dim); }
  .stat-card.sport .stat-icon{ background: var(--volt-dim); }
  .stat-value{ font-family:'Unbounded'; font-weight:700; font-size:19px; }
  .stat-label{ font-size:11.5px; color:var(--text-muted); margin-top:3px; }
  .stat-bar{
    margin-top:12px; height:5px; border-radius:3px; background:#2A323B; overflow:hidden;
  }
  .stat-bar i{ display:block; height:100%; border-radius:3px; }
  .stat-card.cal .stat-bar i{ width:62%; background: var(--flame); }
  .stat-card.sport .stat-bar i{ width:40%; background: var(--volt); }

  /* ---------- prochaine seance ---------- */
  .workout-card{
    margin-top:16px;
    background: var(--surface);
    border:1px solid var(--line);
    border-radius: 22px;
    padding: 18px;
    display:flex; align-items:center; gap:14px;
  }
  .workout-thumb{
    width:52px; height:52px; border-radius:16px;
    background: linear-gradient(145deg, var(--volt-dim), #1a2230);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .workout-meta .t{ font-weight:700; font-size:14.5px; }
  .workout-meta .m{ font-size:12px; color:var(--text-muted); margin-top:3px; }
  .workout-actions{ margin-left:auto; display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .workout-delete{
    width:32px; height:32px; border-radius:10px; background: var(--surface-2, #222A32);
    border:1px solid var(--line); color: var(--text-muted);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .workout-delete:hover{ color: var(--flame); background: var(--flame-dim); }
  .workout-cta{
    width:38px; height:38px; border-radius:50%;
    background: var(--lime); display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }

  /* ---------- bottom nav ---------- */
  .navbar{
    position:absolute; left:0; right:0; bottom:0;
    height: 108px;
    background: linear-gradient(180deg, rgba(18,22,27,0) 0%, var(--bg) 30%);
    display:flex; align-items:flex-end; justify-content:center;
    padding-bottom: 26px;
  }
  .nav-pill{
    width: 300px; height:66px;
    background: rgba(27,33,40,0.9);
    backdrop-filter: blur(14px);
    border: 1px solid var(--line);
    border-radius: 33px;
    display:flex; align-items:center; justify-content:space-between;
    padding: 0 22px;
    position:relative;
  }
  .nav-item{
    display:flex; flex-direction:column; align-items:center; gap:4px;
    color: var(--text-muted);
    width: 44px;
  }
  .nav-item .lbl{ font-size:10px; font-weight:600; }
  .nav-item.cal { color: var(--flame); }
  .nav-item.sport { color: var(--volt); }

  .nav-home{
    position:absolute;
    left:50%; top:-26px; transform: translateX(-50%);
    width: 64px; height:64px; border-radius:50%;
    background: var(--lime);
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 8px 24px rgba(212,242,82,0.35), 0 0 0 6px var(--bg);
  }
  .nav-home::before{
    content:'';
    position:absolute; inset:-8px;
    border-radius:50%;
    border: 1.5px solid rgba(212,242,82,0.35);
    animation: pulse 2.6s ease-out infinite;
  }
  @keyframes pulse{
    0%{ transform:scale(0.9); opacity:0.9; }
    70%{ transform:scale(1.35); opacity:0; }
    100%{ opacity:0; }
  }
  .nav-item, .nav-home{ text-decoration:none; cursor:pointer; }
  .nav-home-label{
    position:absolute; left:50%; transform:translateX(-50%);
    top: 40px; font-size:10px; font-weight:700; color: var(--text);
    white-space:nowrap;
  }

  @media (prefers-reduced-motion: reduce){
    .nav-home::before{ animation:none; }
  }
</style>
</head>
<body>

<div class="device">

  <div class="statusbar">
    <span id="status-time">--:--</span>
    <div class="dots"><span></span><span></span><span></span></div>
  </div>

  <div class="content">
    <div style="display:flex; align-items:flex-start; justify-content:space-between;">
      <div>
        <div class="greeting-eyebrow" id="today-date">—</div>
        <div class="greeting">Bonjour, <span id="greet-name">👋</span></div>
      </div>
      <div onclick="logout()" title="Se déconnecter" style="width:34px;height:34px;border-radius:11px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;margin-top:2px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8A93A0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      </div>
    </div>

    <div class="today-card">
      <div class="ring-wrap">
        <svg width="112" height="112" viewBox="0 0 112 112">
          <circle class="ring-bg" cx="56" cy="56" r="50"></circle>
          <circle class="ring-fg" id="ring-fg" cx="56" cy="56" r="50"></circle>
        </svg>
        <div class="ring-center">
          <div class="num" id="ring-pct">—</div>
          <div class="lbl">de l'objectif</div>
        </div>
      </div>
      <div class="today-info">
        <div class="title">Ton énergie du jour</div>
        <div class="sub" id="today-sub">Chargement…</div>
      </div>
    </div>

    <div class="section-title">Aujourd'hui en un coup d'œil</div>
    <div class="stat-row">
      <div class="stat-card cal">
        <div class="stat-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FF7A59" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c1 3-2 4-2 7a4 4 0 0 0 8 0c0-1-.5-2-1-2 .5 2-1 3-2 2 1-2-1-3-1-5 0-1 .5-2 1-3-2 0-3.5 1-3 3-2 0-3 2-3 4a6 6 0 0 0 6 6"/></svg>
        </div>
        <div class="stat-value" id="cal-value">— kcal</div>
        <div class="stat-label">Calories consommées</div>
        <div class="stat-bar"><i id="cal-bar" style="width:0%"></i></div>
      </div>
      <div class="stat-card sport">
        <div class="stat-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6FA8FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5 17.5 17.5M4 9l3-3 3 3-3 3-3-3zM17 12l3 3-3 3-3-3 3-3zM9 4l1.5-1.5M15 20l1.5-1.5M4 20l1.5-1.5M20 4l-1.5 1.5"/></svg>
        </div>
        <div class="stat-value" id="active-value">— min</div>
        <div class="stat-label">Activité physique</div>
        <div class="stat-bar"><i id="active-bar" style="width:0%"></i></div>
      </div>
    </div>

    <div class="section-title">Prochaine séance</div>
    <div class="workout-card" id="next-workout-card">
      <div class="workout-thumb">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6FA8FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5 17.5 17.5M4 9l3-3 3 3-3 3-3-3zM17 12l3 3-3 3-3-3 3-3z"/></svg>
      </div>
      <div class="workout-meta">
        <div class="t" id="next-workout-title">Chargement…</div>
        <div class="m" id="next-workout-meta"></div>
      </div>
      <div class="workout-actions">
        <button class="workout-delete" id="next-workout-delete" onclick="deleteNextWorkout()" title="Supprimer" style="display:none;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>
        </button>
        <a class="workout-cta" href="sport.html">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#12161B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </a>
      </div>
    </div>
  </div>

  <div class="navbar">
    <div class="nav-pill">
      <a class="nav-item cal" href="calories.html">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c1 3-2 4-2 7a4 4 0 0 0 8 0c0-1-.5-2-1-2 .5 2-1 3-2 2 1-2-1-3-1-5 0-1 .5-2 1-3-2 0-3.5 1-3 3-2 0-3 2-3 4a6 6 0 0 0 6 6"/></svg>
        <span class="lbl">Calories</span>
      </a>

      <div style="width:64px;"></div>

      <a class="nav-item sport" href="sport.html">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5 17.5 17.5M4 9l3-3 3 3-3 3-3-3zM17 12l3 3-3 3-3-3 3-3z"/></svg>
        <span class="lbl">Sport</span>
      </a>
    </div>

    <a class="nav-home" href="index.html">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#12161B" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
    </a>
    <div class="nav-home-label">Accueil</div>
  </div>

</div>

<script src="config.js"></script>
<script src="auth-guard.js"></script>
<script>
  const RING_CIRCUMFERENCE = 314; // 2 * PI * 50

  function setRing(pct){
    const clamped = Math.max(0, Math.min(1, pct));
    const offset = RING_CIRCUMFERENCE * (1 - clamped);
    document.getElementById("ring-fg").style.strokeDashoffset = offset;
    document.getElementById("ring-pct").textContent = Math.round(clamped * 100) + "%";
  }

  async function loadHome(){
    const user = await requireAuth();
    if (!user) return;

    document.getElementById("today-date").textContent =
      new Date().toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });

    const firstName = (user.user_metadata && user.user_metadata.full_name) ? user.user_metadata.full_name.split(" ")[0] : "";
    document.getElementById("greet-name").textContent = (firstName ? firstName + " " : "") + "👋";

    // Profil (objectifs)
    const { data: profile } = await supabaseClient
      .from("profiles").select("*").eq("id", user.id).single();
    const calorieGoal = profile?.calorie_goal ?? 2400;

    // Repas du jour
    const { data: meals } = await supabaseClient
      .from("meals").select("calories")
      .eq("user_id", user.id)
      .gte("logged_at", startOfToday().toISOString())
      .lte("logged_at", endOfToday().toISOString());

    const consumed = (meals || []).reduce((s, m) => s + (m.calories || 0), 0);
    const remaining = Math.max(0, calorieGoal - consumed);
    setRing(consumed / calorieGoal);
    document.getElementById("today-sub").innerHTML =
      `<b>${consumed.toLocaleString("fr-FR")}</b> / ${calorieGoal.toLocaleString("fr-FR")} kcal consommées.<br>Il te reste <b>${remaining.toLocaleString("fr-FR")} kcal</b> avant ce soir.`;
    document.getElementById("cal-value").textContent = consumed.toLocaleString("fr-FR") + " kcal";
    document.getElementById("cal-bar").style.width = Math.min(100, (consumed / calorieGoal) * 100) + "%";

    // Séances du jour (durée d'activité déjà faite)
    const { data: todaysWorkouts } = await supabaseClient
      .from("workouts").select("duration_min, completed")
      .eq("user_id", user.id)
      .gte("scheduled_at", startOfToday().toISOString())
      .lte("scheduled_at", endOfToday().toISOString());

    const activeMin = (todaysWorkouts || []).filter(w => w.completed).reduce((s, w) => s + (w.duration_min || 0), 0);
    document.getElementById("active-value").textContent = activeMin + " min";
    document.getElementById("active-bar").style.width = Math.min(100, (activeMin / 60) * 100) + "%";

    // Prochaine séance non terminée, à venir uniquement
    const { data: next } = await supabaseClient
      .from("workouts").select("*")
      .eq("user_id", user.id)
      .eq("completed", false)
      .gte("scheduled_at", startOfToday().toISOString())
      .order("scheduled_at", { ascending: true })
      .limit(1)
      .maybeSingle();

    const deleteBtn = document.getElementById("next-workout-delete");
    if (next){
      window.nextWorkoutId = next.id;
      deleteBtn.style.display = "flex";
      document.getElementById("next-workout-title").textContent = next.name;
      const when = next.scheduled_at ? new Date(next.scheduled_at).toLocaleString("fr-FR", { weekday: "short", hour: "2-digit", minute: "2-digit" }) : "Non planifiée";
      document.getElementById("next-workout-meta").textContent = `${when} · ${next.duration_min || "?"} min`;
    } else {
      window.nextWorkoutId = null;
      deleteBtn.style.display = "none";
      document.getElementById("next-workout-title").textContent = "Aucune séance planifiée";
      document.getElementById("next-workout-meta").textContent = "Ajoute-en une depuis l'onglet Sport";
    }
  }

  async function deleteNextWorkout(){
    if (!window.nextWorkoutId) return;
    if (!confirm("Supprimer cette séance ?")) return;
    const { error } = await supabaseClient.from("workouts").delete().eq("id", window.nextWorkoutId);
    if (error){ alert("Erreur : " + error.message); return; }
    loadHome();
  }

  loadHome();
</script>
</body>
</html>
