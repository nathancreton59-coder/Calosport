<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Accueil — Suivi fitness</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg: #12161B;
    --surface: #1B2128;
    --surface-2: #222A32;
    --text: #F2F0EA;
    --text-muted: #8A93A0;
    --line: #2A323B;

    --lime: #D4F252;
    --lime-dim: #3A4420;
    --flame: #FF7A59;
    --flame-dim: #3D2620;
    --volt: #6FA8FF;
    --volt-dim: #202B3D;
  }

  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0;
    background: #0A0C0F;
    font-family: 'Inter', sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  body{ display:flex; min-height:100vh; }

  /* ---------- sidebar ---------- */
  .sidebar{
    width: 264px; flex-shrink:0;
    background: var(--bg); border-right:1px solid var(--line);
    padding: 28px 18px; display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh;
  }
  .sidebar-brand{ display:flex; align-items:center; gap:12px; padding: 6px 10px 30px; }
  .brand-mark{
    width:38px; height:38px; border-radius:12px; background:var(--lime);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .brand-name{ font-family:'Unbounded'; font-weight:700; font-size:14.5px; line-height:1.25; }
  .brand-name span{ display:block; font-family:'Inter'; font-weight:600; font-size:11px; color:var(--text-muted); margin-top:2px; }

  .sidebar-nav{ display:flex; flex-direction:column; gap:4px; }
  .sidebar-link{
    display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:13px;
    color: var(--text-muted); text-decoration:none; font-weight:600; font-size:14px;
  }
  .sidebar-link .dot{ width:7px; height:7px; border-radius:50%; background: var(--text-muted); flex-shrink:0; }
  .sidebar-link.active{ background: var(--surface); color: var(--text); }
  .sidebar-link.home.active .dot{ background: var(--lime); box-shadow:0 0 6px rgba(212,242,82,0.6); }
  .sidebar-link.cal.active .dot{ background: var(--flame); box-shadow:0 0 6px rgba(255,122,89,0.6); }
  .sidebar-link.sport.active .dot{ background: var(--volt); box-shadow:0 0 6px rgba(111,168,255,0.6); }

  .sidebar-footer{ margin-top:auto; padding-top:16px; border-top:1px solid var(--line); }
  .sidebar-logout{
    width:100%; display:flex; align-items:center; gap:10px; padding:11px 14px; border-radius:13px;
    background:none; border:none; color:var(--text-muted); font-family:'Inter'; font-weight:600; font-size:13px; cursor:pointer;
  }
  .sidebar-logout:hover{ background: var(--surface); color: var(--flame); }

  /* ---------- main ---------- */
  .main{ flex:1; padding: 48px 56px; min-width:0; }
  .main-inner{ max-width: 900px; }

  .page-head{ display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:32px; }
  .greeting-eyebrow{
    font-size: 12.5px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--text-muted); font-weight: 600; margin: 0 0 6px;
  }
  .greeting{ font-family:'Unbounded', sans-serif; font-weight: 700; font-size: 32px; line-height:1.15; margin:0; }
  .greeting span{ color: var(--lime); }

  .section-title{
    font-size: 12px; letter-spacing:0.1em; text-transform:uppercase;
    color: var(--text-muted); font-weight:700; margin: 0 0 14px;
  }

  /* ---------- grille du tableau de bord ---------- */
  .dashboard-grid{ display:grid; grid-template-columns: 1.5fr 1fr; gap:24px; align-items:start; }
  .col-stack{ display:flex; flex-direction:column; gap:24px; }

  /* ---------- ring energie du jour ---------- */
  .today-card{
    background: linear-gradient(160deg, var(--surface) 0%, #171C22 100%);
    border: 1px solid var(--line);
    border-radius: 26px;
    padding: 30px;
    display:flex;
    align-items:center;
    gap: 28px;
  }
  .ring-wrap{ position:relative; width:132px; height:132px; flex-shrink:0; }
  .ring-wrap svg{ transform: rotate(-90deg); width:132px; height:132px; }
  .ring-bg{ fill:none; stroke: #2A323B; stroke-width: 10; }
  .ring-fg{
    fill:none; stroke: var(--lime); stroke-width: 10; stroke-linecap: round;
    stroke-dasharray: 314; stroke-dashoffset: 110;
    filter: drop-shadow(0 0 6px rgba(212,242,82,0.45));
  }
  .ring-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .ring-center .num{ font-family:'Unbounded'; font-weight:700; font-size:23px; }
  .ring-center .lbl{ font-size:10.5px; color:var(--text-muted); margin-top:2px; }

  .today-info .title{ font-weight:700; font-size:16.5px; margin-bottom:8px; }
  .today-info .sub{ font-size:13.5px; color: var(--text-muted); line-height:1.6; }
  .today-info .sub b{ color: var(--text); font-weight:600; }

  /* ---------- deux cartes stats ---------- */
  .stat-row{ display:flex; gap: 16px; }
  .stat-card{ flex:1; background: var(--surface); border:1px solid var(--line); border-radius: 20px; padding: 20px; }
  .stat-icon{ width:36px; height:36px; border-radius: 12px; display:flex; align-items:center; justify-content:center; margin-bottom: 14px; }
  .stat-card.cal .stat-icon{ background: var(--flame-dim); }
  .stat-card.sport .stat-icon{ background: var(--volt-dim); }
  .stat-value{ font-family:'Unbounded'; font-weight:700; font-size:20px; }
  .stat-label{ font-size:12px; color:var(--text-muted); margin-top:4px; }
  .stat-bar{ margin-top:14px; height:5px; border-radius:3px; background:#2A323B; overflow:hidden; }
  .stat-bar i{ display:block; height:100%; border-radius:3px; }
  .stat-card.cal .stat-bar i{ background: var(--flame); }
  .stat-card.sport .stat-bar i{ background: var(--volt); }

  /* ---------- prochaine seance (colonne droite) ---------- */
  .workout-card{
    background: var(--surface); border:1px solid var(--line); border-radius: 22px; padding: 22px;
    display:flex; flex-direction:column; gap:16px;
  }
  .workout-thumb{
    width:52px; height:52px; border-radius:16px;
    background: linear-gradient(145deg, var(--volt-dim), #1a2230);
    display:flex; align-items:center; justify-content:center;
  }
  .workout-meta .t{ font-weight:700; font-size:15px; }
  .workout-meta .m{ font-size:12.5px; color:var(--text-muted); margin-top:4px; }
  .workout-actions{ display:flex; align-items:center; gap:10px; }
  .workout-delete{
    width:36px; height:36px; border-radius:11px; background: var(--surface-2);
    border:1px solid var(--line); color: var(--text-muted);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .workout-delete:hover{ color: var(--flame); background: var(--flame-dim); }
  .workout-cta{
    flex:1; height:38px; border-radius:12px;
    background: var(--lime); display:flex; align-items:center; justify-content:center; gap:8px;
    color:#12161B; text-decoration:none; font-weight:700; font-size:13px;
  }
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-brand">
    <div class="brand-mark">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#12161B" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
    </div>
    <div class="brand-name">Suivi Fitness<span>Calories & sport</span></div>
  </div>

  <div class="sidebar-nav">
    <a class="sidebar-link home active" href="index.html">
      <div class="dot"></div>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
      Accueil
    </a>
    <a class="sidebar-link cal" href="calories.html">
      <div class="dot"></div>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c1 3-2 4-2 7a4 4 0 0 0 8 0c0-1-.5-2-1-2 .5 2-1 3-2 2 1-2-1-3-1-5 0-1 .5-2 1-3-2 0-3.5 1-3 3-2 0-3 2-3 4a6 6 0 0 0 6 6"/></svg>
      Calories
    </a>
    <a class="sidebar-link sport" href="sport.html">
      <div class="dot"></div>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5 17.5 17.5M4 9l3-3 3 3-3 3-3-3zM17 12l3 3-3 3-3-3 3-3z"/></svg>
      Sport
    </a>
  </div>

  <div class="sidebar-footer">
    <button class="sidebar-logout" onclick="logout()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      Déconnexion
    </button>
  </div>
</div>

<div class="main">
  <div class="main-inner">
    <div class="page-head">
      <div>
        <div class="greeting-eyebrow" id="today-date">—</div>
        <div class="greeting">Bonjour, <span id="greet-name">👋</span></div>
      </div>
    </div>

    <div class="dashboard-grid">
      <div class="col-stack">
        <div class="today-card">
          <div class="ring-wrap">
            <svg viewBox="0 0 112 112">
              <circle class="ring-bg" cx="56" cy="56" r="50"></circle>
              <circle class="ring-fg" id="ring-fg" cx="56" cy="56" r="50"></circle>
            </svg>
            <div class="ring-center">
              <div class="num" id="ring-pct">—</div>
              <div class="lbl">de l'objectif</div>
            </div>
          </div>
          <div class="today-info">
            <div class="title">Ton énergie du jour</div>
            <div class="sub" id="today-sub">Chargement…</div>
          </div>
        </div>

        <div>
          <div class="section-title">Aujourd'hui en un coup d'œil</div>
          <div class="stat-row">
            <div class="stat-card cal">
              <div class="stat-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FF7A59" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c1 3-2 4-2 7a4 4 0 0 0 8 0c0-1-.5-2-1-2 .5 2-1 3-2 2 1-2-1-3-1-5 0-1 .5-2 1-3-2 0-3.5 1-3 3-2 0-3 2-3 4a6 6 0 0 0 6 6"/></svg>
              </div>
              <div class="stat-value" id="cal-value">— kcal</div>
              <div class="stat-label">Calories consommées</div>
              <div class="stat-bar"><i id="cal-bar" style="width:0%"></i></div>
            </div>
            <div class="stat-card sport">
              <div class="stat-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6FA8FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5 17.5 17.5M4 9l3-3 3 3-3 3-3-3zM17 12l3 3-3 3-3-3 3-3zM9 4l1.5-1.5M15 20l1.5-1.5M4 20l1.5-1.5M20 4l-1.5 1.5"/></svg>
              </div>
              <div class="stat-value" id="active-value">— min</div>
              <div class="stat-label">Activité physique</div>
              <div class="stat-bar"><i id="active-bar" style="width:0%"></i></div>
            </div>
          </div>
        </div>
      </div>

      <div>
        <div class="section-title">Prochaine séance</div>
        <div class="workout-card" id="next-workout-card">
          <div class="workout-thumb">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6FA8FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5 17.5 17.5M4 9l3-3 3 3-3 3-3-3zM17 12l3 3-3 3-3-3 3-3z"/></svg>
          </div>
          <div class="workout-meta">
            <div class="t" id="next-workout-title">Chargement…</div>
            <div class="m" id="next-workout-meta"></div>
          </div>
          <div class="workout-actions">
            <a class="workout-cta" href="sport.html">
              Voir sur Sport
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#12161B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </a>
            <button class="workout-delete" id="next-workout-delete" onclick="deleteNextWorkout()" title="Supprimer" style="display:none;">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="auth-guard.js"></script>
<script>
  const RING_CIRCUMFERENCE = 314; // 2 * PI * 50

  function setRing(pct){
    const clamped = Math.max(0, Math.min(1, pct));
    const offset = RING_CIRCUMFERENCE * (1 - clamped);
    document.getElementById("ring-fg").style.strokeDashoffset = offset;
    document.getElementById("ring-pct").textContent = Math.round(clamped * 100) + "%";
  }

  async function loadHome(){
    const user = await requireAuth();
    if (!user) return;

    document.getElementById("today-date").textContent =
      new Date().toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });

    const firstName = (user.user_metadata && user.user_metadata.full_name) ? user.user_metadata.full_name.split(" ")[0] : "";
    document.getElementById("greet-name").textContent = (firstName ? firstName + " " : "") + "👋";

    const { data: profile } = await supabaseClient
      .from("profiles").select("*").eq("id", user.id).single();
    const calorieGoal = profile?.calorie_goal ?? 2400;

    const { data: meals } = await supabaseClient
      .from("meals").select("calories")
      .eq("user_id", user.id)
      .gte("logged_at", startOfToday().toISOString())
      .lte("logged_at", endOfToday().toISOString());

    const consumed = (meals || []).reduce((s, m) => s + (m.calories || 0), 0);
    const remaining = Math.max(0, calorieGoal - consumed);
    setRing(consumed / calorieGoal);
    document.getElementById("today-sub").innerHTML =
      `<b>${consumed.toLocaleString("fr-FR")}</b> / ${calorieGoal.toLocaleString("fr-FR")} kcal consommées.<br>Il te reste <b>${remaining.toLocaleString("fr-FR")} kcal</b> avant ce soir.`;
    document.getElementById("cal-value").textContent = consumed.toLocaleString("fr-FR") + " kcal";
    document.getElementById("cal-bar").style.width = Math.min(100, (consumed / calorieGoal) * 100) + "%";

    const { data: todaysWorkouts } = await supabaseClient
      .from("workouts").select("duration_min, completed")
      .eq("user_id", user.id)
      .gte("scheduled_at", startOfToday().toISOString())
      .lte("scheduled_at", endOfToday().toISOString());

    const activeMin = (todaysWorkouts || []).filter(w => w.completed).reduce((s, w) => s + (w.duration_min || 0), 0);
    document.getElementById("active-value").textContent = activeMin + " min";
    document.getElementById("active-bar").style.width = Math.min(100, (activeMin / 60) * 100) + "%";

    const { data: next } = await supabaseClient
      .from("workouts").select("*")
      .eq("user_id", user.id)
      .eq("completed", false)
      .gte("scheduled_at", startOfToday().toISOString())
      .order("scheduled_at", { ascending: true })
      .limit(1)
      .maybeSingle();

    const deleteBtn = document.getElementById("next-workout-delete");
    if (next){
      window.nextWorkoutId = next.id;
      deleteBtn.style.display = "flex";
      document.getElementById("next-workout-title").textContent = next.name;
      const when = next.scheduled_at ? new Date(next.scheduled_at).toLocaleString("fr-FR", { weekday: "short", hour: "2-digit", minute: "2-digit" }) : "Non planifiée";
      document.getElementById("next-workout-meta").textContent = `${when} · ${next.duration_min || "?"} min`;
    } else {
      window.nextWorkoutId = null;
      deleteBtn.style.display = "none";
      document.getElementById("next-workout-title").textContent = "Aucune séance planifiée";
      document.getElementById("next-workout-meta").textContent = "Ajoute-en une depuis l'onglet Sport";
    }
  }

  async function deleteNextWorkout(){
    if (!window.nextWorkoutId) return;
    if (!confirm("Supprimer cette séance ?")) return;
    const { error } = await supabaseClient.from("workouts").delete().eq("id", window.nextWorkoutId);
    if (error){ alert("Erreur : " + error.message); return; }
    loadHome();
  }

  loadHome();
</script>
</body>
</html>
