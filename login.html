<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<script>(function(){try{var t=localStorage.getItem("calosport-theme-resolved")||"dark";document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<title>Connexion — Suivi fitness</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="calosport-icon.svg">
<link rel="alternate icon" href="calosport-icon-32.png">
<link rel="apple-touch-icon" href="calosport-icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="login.css">
</head>
<body>

<div class="auth-card">
  <div class="brand">
    <div class="brand-mark">
      <svg width="26" height="26" viewBox="0 0 200 200"><circle cx="100" cy="100" r="62" fill="none" stroke="#12161B" stroke-width="20" stroke-linecap="round" stroke-dasharray="300 90" transform="rotate(38 100 100)"/><g transform="translate(124,99) scale(2.25)" fill="#12161B"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></g></svg>
    </div>
    <h1>Bienvenue</h1>
    <p>Suivi calories & séances de sport</p>
  </div>

  <div class="tabs">
    <div class="tab active" id="tab-login" onclick="switchTab('login')">Se connecter</div>
    <div class="tab" id="tab-signup" onclick="switchTab('signup')">Créer un compte</div>
  </div>

  <form id="auth-form" onsubmit="handleSubmit(event)">
    <div class="field" id="name-field" style="display:none;">
      <label>Prénom</label>
      <input type="text" id="full_name" placeholder="Léa">
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="email" placeholder="toi@exemple.com" required>
    </div>
    <div class="field">
      <label>Mot de passe</label>
      <input type="password" id="password" placeholder="••••••••" minlength="6" required>
    </div>
    <button class="submit-btn" id="submit-btn" type="submit">Se connecter</button>
    <div class="msg" id="msg"></div>
  </form>
</div>

<script src="config.js"></script>
<script>
  let mode = "login";

  function switchTab(m){
    mode = m;
    document.getElementById("tab-login").classList.toggle("active", m === "login");
    document.getElementById("tab-signup").classList.toggle("active", m === "signup");
    document.getElementById("name-field").style.display = m === "signup" ? "block" : "none";
    document.getElementById("submit-btn").textContent = m === "signup" ? "Créer mon compte" : "Se connecter";
    document.getElementById("msg").textContent = "";
  }

  async function handleSubmit(e){
    e.preventDefault();
    const btn = document.getElementById("submit-btn");
    const msg = document.getElementById("msg");
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    msg.textContent = ""; msg.className = "msg";
    btn.disabled = true;

    try{
      if (mode === "signup"){
        // Mot de passe plus solide exigé à la création du compte (les comptes existants ne changent pas)
        if (password.length < 12 || !/[A-Za-zÀ-ÿ]/.test(password) || !/[0-9]/.test(password)){
          throw new Error("Choisis un mot de passe d'au moins 12 caractères, avec au moins une lettre et un chiffre.");
        }
        const full_name = document.getElementById("full_name").value.trim();
        const { error } = await supabaseClient.auth.signUp({
          email, password,
          options: { data: { full_name } }
        });
        if (error) throw error;
        msg.textContent = "Compte créé ! Vérifie ta boîte mail si une confirmation est demandée, puis connecte-toi.";
        msg.className = "msg ok";
        switchTab("login");
      } else {
        const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) throw error;
        window.location.href = "index.html";
      }
    } catch(err){
      msg.textContent = err.message || "Une erreur est survenue.";
      msg.className = "msg error";
    } finally {
      btn.disabled = false;
    }
  }

  // Si déjà connecté, on saute direct à l'accueil
  (async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) window.location.href = "index.html";
  })();
</script>
</body>
</html>
