<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<script>(function(){try{var t=localStorage.getItem("calosport-theme-resolved")||"dark";document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<title>Flux — Suivi fitness</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="calosport-icon.svg">
<link rel="alternate icon" href="calosport-icon-32.png">
<link rel="apple-touch-icon" href="calosport-icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg: #12161B; --surface: #1B2128; --surface-2: #222A32;
    --text: #F2F0EA; --text-muted: #8A93A0; --line: #2A323B;
    --lime: #D4F252; --lime-dim: #3A4420;
    --flame: #FF7A59; --flame-dim: #3D2620;
    --volt: #6FA8FF; --volt-dim: #202B3D;
  }
  *{ box-sizing:border-box; }
  /* ---------- mode clair ---------- */
  :root[data-theme="light"]{
    --bg: #EFF1EA; --surface: #FFFFFF; --surface-2: #F3F4EE;
    --text: #14181D; --text-muted: #667085; --line: #E1E3DC;
    --lime: #6F9A16; --lime-dim: #EAF3D2;
    --flame: #D9522E; --flame-dim: #FBE4DC;
    --volt: #2F63C7; --volt-dim: #E3EBFB;
  }
  html[data-theme="light"], html[data-theme="light"] body{ background: var(--bg); }
  html,body{ margin:0; padding:0; background:#0A0C0F; font-family:'Inter',sans-serif; color:var(--text); -webkit-font-smoothing:antialiased; }
  body{ display:flex; min-height:100vh; }

  /* ---------- sidebar ---------- */
  .sidebar{
    width: 264px; flex-shrink:0;
    background: var(--bg); border-right:1px solid var(--line);
    padding: 28px 18px; display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh;
  }
  .sidebar-brand{ display:flex; align-items:center; gap:12px; padding: 6px 10px 30px; }
  .brand-mark{
    width:38px; height:38px; border-radius:12px; background:var(--lime);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .brand-name{ font-family:'Unbounded'; font-weight:700; font-size:14.5px; line-height:1.25; }
  .brand-name span{ display:block; font-family:'Inter'; font-weight:600; font-size:11px; color:var(--text-muted); margin-top:2px; }

  .sidebar-nav{ display:flex; flex-direction:column; gap:4px; }
  .sidebar-link{
    display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:13px;
    color: var(--text-muted); text-decoration:none; font-weight:600; font-size:14px;
  }
  .sidebar-link .dot{ width:7px; height:7px; border-radius:50%; background: var(--text-muted); flex-shrink:0; }
  .sidebar-link.active{ background: var(--surface); color: var(--text); }
  .sidebar-link.home.active .dot{ background: var(--lime); box-shadow:0 0 6px rgba(212,242,82,0.6); }
  .sidebar-link.cal.active .dot{ background: var(--flame); box-shadow:0 0 6px rgba(255,122,89,0.6); }
  .sidebar-link.sport.active .dot{ background: var(--volt); box-shadow:0 0 6px rgba(111,168,255,0.6); }
  .sidebar-link.calendar.active .dot{ background: var(--volt); box-shadow:0 0 6px rgba(111,168,255,0.6); }
  .sidebar-link.friends.active .dot{ background: var(--flame); box-shadow:0 0 6px rgba(255,122,89,0.6); }
  .sidebar-link.leaderboard.active .dot{ background: var(--lime); box-shadow:0 0 6px rgba(212,242,82,0.6); }
  .sidebar-link.feed.active .dot{ background: var(--volt); box-shadow:0 0 6px rgba(111,168,255,0.6); }
  .sidebar-link.settings{ margin-top:8px; padding-top:14px; border-top:1px solid var(--line); }
  .sidebar-link.library.active .dot, .sidebar-link.progress.active .dot{ background: var(--text); }

  .sidebar-footer{ margin-top:auto; padding-top:16px; border-top:1px solid var(--line); }
  .sidebar-logout{
    width:100%; display:flex; align-items:center; gap:10px; padding:11px 14px; border-radius:13px;
    background:none; border:none; color:var(--text-muted); font-family:'Inter'; font-weight:600; font-size:13px; cursor:pointer;
  }
  .sidebar-logout:hover{ background: var(--surface); color: var(--flame); }

  /* ---------- main ---------- */
  .main{ flex:1; padding: 48px 56px 100px; min-width:0; }
  .main-inner{ max-width: 640px; }
  .page-title{ font-family:'Unbounded'; font-weight:700; font-size:32px; margin-bottom:8px; }
  .page-sub{ font-size:13.5px; color:var(--text-muted); margin-bottom:22px; }

  .tab-row{ display:flex; gap:8px; margin-bottom:22px; }
  .tab-btn{
    border:1px solid var(--line); background: var(--surface); color: var(--text-muted);
    font-family:'Inter'; font-weight:700; font-size:13px; padding:10px 18px; border-radius:12px; cursor:pointer;
  }
  .tab-btn.active{ background: var(--lime); border-color: var(--lime); color:#12161B; }

  .feed-card{ background: var(--surface); border:1px solid var(--line); border-radius:20px; padding:20px; margin-bottom:16px; }
  .feed-top{ display:flex; align-items:center; gap:12px; margin-bottom:14px; }
  .feed-avatar{
    width:40px; height:40px; border-radius:50%; background: var(--surface-2); color: var(--text-muted);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; flex-shrink:0;
    font-family:'Unbounded';
  }
  .feed-who{ flex:1; min-width:0; }
  .feed-name{ font-weight:700; font-size:13.5px; }
  .feed-date{ font-size:11px; color: var(--text-muted); margin-top:1px; }

  .feed-title{ font-weight:700; font-size:16px; margin-bottom:4px; }
  .feed-exos{ font-size:12.5px; color: var(--text-muted); line-height:1.5; margin-bottom:16px;
    overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }

  .feed-stats{ display:grid; grid-template-columns: repeat(4, 1fr); gap:8px; margin-bottom:14px; }
  .feed-stat .k{ font-size:10.5px; color: var(--text-muted); margin-bottom:3px; }
  .feed-stat .v{ font-weight:700; font-size:14px; }

  .feed-actions{ display:flex; align-items:center; gap:22px; padding-top:12px; border-top:1px solid var(--line); }
  .feed-action{
    display:flex; align-items:center; gap:7px; background:none; border:none; cursor:pointer;
    color: var(--text-muted); font-family:'Inter'; font-weight:600; font-size:13px; padding:0;
  }
  .feed-action.reacted{ color: var(--lime); }
  .feed-action svg{ flex-shrink:0; }

  .comments-box{ margin-top:14px; padding-top:14px; border-top:1px solid var(--line); display:none; }
  .comments-box.open{ display:block; }
  .comment-row{ font-size:12.5px; margin-bottom:10px; }
  .comment-row b{ font-weight:700; }
  .comment-time{ font-size:10.5px; color: var(--text-muted); margin-left:6px; }
  .comment-input-row{ display:flex; gap:8px; margin-top:8px; }
  .comment-input-row input{
    flex:1; background: var(--surface-2); border:1px solid var(--line); border-radius:12px;
    padding:9px 13px; font-size:12.5px; color:var(--text); font-family:'Inter';
  }
  .comment-input-row input:focus{ outline:none; border-color: var(--volt); }
  .comment-send{ border:none; background: var(--volt); color:#12161B; font-weight:700; font-size:12px; padding:0 16px; border-radius:12px; cursor:pointer; }

  .empty-state{ text-align:center; padding:50px 20px; color: var(--text-muted); font-size:13px; }
  .empty-state a{ color: var(--volt); font-weight:700; text-decoration:none; }
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-brand">
    <div class="brand-mark">
      <svg width="20" height="20" viewBox="0 0 200 200"><circle cx="100" cy="100" r="62" fill="none" stroke="#12161B" stroke-width="20" stroke-linecap="round" stroke-dasharray="300 90" transform="rotate(38 100 100)"/><g transform="translate(124,99) scale(2.25)" fill="#12161B"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></g></svg>
    </div>
    <div class="brand-name">Suivi Fitness<span>Calories & sport</span></div>
  </div>

  <div class="sidebar-nav">
    <a class="sidebar-link home" href="index.html">
      <div class="dot"></div>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
      Accueil
    </a>
    <a class="sidebar-link cal" href="calories.html">
      <div class="dot"></div>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c1 3-2 4-2 7a4 4 0 0 0 8 0c0-1-.5-2-1-2 .5 2-1 3-2 2 1-2-1-3-1-5 0-1 .5-2 1-3-2 0-3.5 1-3 3-2 0-3 2-3 4a6 6 0 0 0 6 6"/></svg>
      Calories
    </a>
    <a class="sidebar-link sport" href="sport.html">
      <div class="dot"></div>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="9" width="2.3" height="6" rx="1"/><rect x="4.3" y="7" width="2" height="10" rx="1"/><line x1="7.3" y1="12" x2="16.7" y2="12"/><rect x="17.7" y="7" width="2" height="10" rx="1"/><rect x="20.2" y="9" width="2.3" height="6" rx="1"/></svg>
      Sport
    </a>
    <a class="sidebar-link calendar" href="calendar.html">
      <div class="dot"></div>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      Calendrier
    </a>
    <a class="sidebar-link progress" href="progress.html">
      <div class="dot"></div>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
      Progression
    </a>
    <a class="sidebar-link feed active" href="feed.html">
      <div class="dot"></div>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11a9 9 0 0 1 9 9"/><path d="M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1"/></svg>
      Flux
    </a>
    <a class="sidebar-link friends" href="friends.html">
      <div class="dot"></div>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Amis
    </a>
    <a class="sidebar-link leaderboard" href="leaderboard.html">
      <div class="dot"></div>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M7 6H4a2 2 0 0 0 0 4h1.5M17 6h3a2 2 0 0 1 0 4h-1.5"/></svg>
      Classement
    </a>
    <a class="sidebar-link library" href="library.html">
      <div class="dot"></div>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      Bibliothèques
    </a>
    <a class="sidebar-link settings" href="settings.html">
      <div class="dot"></div>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
      Réglages
    </a>
  </div>

  <div class="sidebar-footer">
    <button class="sidebar-logout" onclick="logout()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      Déconnexion
    </button>
  </div>
</div>

<div class="main">
  <div class="main-inner">
    <div class="page-title">Flux</div>
    <div class="page-sub">Tes séances et celles de tes amis.</div>

    <div class="tab-row">
      <button class="tab-btn" id="tab-self" onclick="switchScope('self')">Seulement vous</button>
      <button class="tab-btn active" id="tab-friends" onclick="switchScope('friends')">Amis</button>
    </div>

    <div id="feed-list">
      <div class="empty-state">Chargement…</div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="auth-guard.js"></script>
<script>
  let scope = "friends";
  let MY_ID = null;

  function initial(name){ return (name || "?").trim().charAt(0).toUpperCase(); }
  function escapeHtml(str){
    const d = document.createElement("div");
    d.textContent = str;
    return d.innerHTML;
  }
  function relativeDate(iso){
    const d = new Date(iso);
    return d.toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" });
  }

  function switchScope(s){
    scope = s;
    document.getElementById("tab-self").classList.toggle("active", s === "self");
    document.getElementById("tab-friends").classList.toggle("active", s === "friends");
    loadFeed();
  }

  async function loadFeed(){
    const listEl = document.getElementById("feed-list");
    listEl.innerHTML = `<div class="empty-state">Chargement…</div>`;

    const { data, error } = await supabaseClient.rpc("get_feed", { p_scope: scope, p_limit: 30 });
    if (error){
      listEl.innerHTML = `<div class="empty-state">Erreur : ${error.message}</div>`;
      return;
    }

    if (!data || !data.length){
      listEl.innerHTML = scope === "self"
        ? `<div class="empty-state">Termine une séance pour la voir apparaître ici.</div>`
        : `<div class="empty-state">Aucune activité pour l'instant.<br><a href="friends.html">Ajoute des amis →</a></div>`;
      return;
    }

    listEl.innerHTML = data.map(item => {
      const displayName = item.full_name || item.username || "Quelqu'un";
      return `
      <div class="feed-card" id="card-${item.workout_id}">
        <div class="feed-top">
          <div class="feed-avatar">${initial(displayName)}</div>
          <div class="feed-who">
            <div class="feed-name">${escapeHtml(displayName)}</div>
            <div class="feed-date">${relativeDate(item.scheduled_at)}</div>
          </div>
        </div>
        <div class="feed-title">${escapeHtml(item.muscle_groups)}</div>
        <div class="feed-exos">${escapeHtml(item.exercise_names)}</div>
        <div class="feed-stats">
          <div class="feed-stat"><div class="k">Durée</div><div class="v">${item.duration_min ? item.duration_min + " min" : "—"}</div></div>
          <div class="feed-stat"><div class="k">${energyUnitLabel()}</div><div class="v">${item.calories_burned ? Math.round(kcalToDisplayEnergy(item.calories_burned)) : "—"}</div></div>
          <div class="feed-stat"><div class="k">Volume</div><div class="v">${Math.round(kgToDisplayWeight(item.volume_kg)).toLocaleString("fr-FR")} ${weightUnitLabel()}</div></div>
          <div class="feed-stat"><div class="k">Records</div><div class="v">${item.records_count || 0}</div></div>
        </div>
        <div class="feed-actions">
          <button class="feed-action ${item.my_reaction ? "reacted" : ""}" id="react-btn-${item.workout_id}" onclick="reactTo('${item.workout_id}')">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="${item.my_reaction ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11.5V7a2 2 0 0 1 4 0v4M11 11V4a2 2 0 0 1 4 0v7M15 10.5V6a2 2 0 0 1 4 0v9a7 7 0 0 1-7 7h-2c-2.5 0-3.5-.5-5-2l-3.5-4a1.5 1.5 0 0 1 2.4-1.8L7 17"/></svg>
            <span id="react-count-${item.workout_id}">${item.reactions_count || 0}</span>
          </button>
          <button class="feed-action" onclick="toggleComments('${item.workout_id}')">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-8.38 8.38H8.5L3 21l1.12-4.5A8.38 8.38 0 1 1 21 11.5z"/></svg>
            <span id="comment-count-${item.workout_id}">${item.comments_count || 0}</span>
          </button>
        </div>
        <div class="comments-box" id="comments-${item.workout_id}">
          <div id="comments-list-${item.workout_id}"></div>
          <div class="comment-input-row">
            <input type="text" id="comment-input-${item.workout_id}" placeholder="Écrire un commentaire…" maxlength="500" onkeydown="if(event.key==='Enter')sendComment('${item.workout_id}')">
            <button class="comment-send" onclick="sendComment('${item.workout_id}')">Envoyer</button>
          </div>
        </div>
      </div>`;
    }).join("");
  }

  async function reactTo(workoutId){
    const { data, error } = await supabaseClient.rpc("toggle_workout_reaction", { p_workout_id: workoutId });
    if (error) return;
    const btn = document.getElementById(`react-btn-${workoutId}`);
    const countEl = document.getElementById(`react-count-${workoutId}`);
    let count = parseInt(countEl.textContent) || 0;
    if (data){
      btn.classList.add("reacted");
      btn.querySelector("svg").setAttribute("fill", "currentColor");
      countEl.textContent = count + 1;
    } else {
      btn.classList.remove("reacted");
      btn.querySelector("svg").setAttribute("fill", "none");
      countEl.textContent = Math.max(0, count - 1);
    }
  }

  const loadedComments = {};

  async function toggleComments(workoutId){
    const box = document.getElementById(`comments-${workoutId}`);
    box.classList.toggle("open");
    if (box.classList.contains("open") && !loadedComments[workoutId]){
      await refreshComments(workoutId);
    }
  }

  async function refreshComments(workoutId){
    const { data, error } = await supabaseClient.rpc("get_workout_comments", { p_workout_id: workoutId });
    const listEl = document.getElementById(`comments-list-${workoutId}`);
    if (error){ listEl.innerHTML = `<div class="comment-row">Erreur de chargement.</div>`; return; }
    loadedComments[workoutId] = true;
    if (!data || !data.length){
      listEl.innerHTML = `<div class="comment-row" style="color:var(--text-muted);">Aucun commentaire pour l'instant.</div>`;
      return;
    }
    listEl.innerHTML = data.map(c => `
      <div class="comment-row">
        <b>${escapeHtml(c.full_name || c.username)}</b> ${escapeHtml(c.body)}
        <span class="comment-time">${new Date(c.created_at).toLocaleDateString("fr-FR")}</span>
      </div>`).join("");
  }

  async function sendComment(workoutId){
    const input = document.getElementById(`comment-input-${workoutId}`);
    const body = input.value.trim();
    if (!body) return;
    const { data, error } = await supabaseClient.rpc("add_workout_comment", { p_workout_id: workoutId, p_body: body });
    if (error || !data || !data.ok){
      alert((data && data.error) || (error && error.message) || "Erreur lors de l'envoi.");
      return;
    }
    input.value = "";
    loadedComments[workoutId] = false;
    await refreshComments(workoutId);
    const countEl = document.getElementById(`comment-count-${workoutId}`);
    countEl.textContent = (parseInt(countEl.textContent) || 0) + 1;
  }

  (async function init(){
    const user = await requireAuth();
    if (!user) return;
    MY_ID = user.id;
    await loadFeed();
  })();
</script>
</body>
</html>
