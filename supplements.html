<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<script>(function(){try{var t=localStorage.getItem("calosport-theme-resolved")||"dark";document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<title>Compléments — Suivi fitness</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="calosport-icon.svg">
<link rel="alternate icon" href="calosport-icon-32.png">
<link rel="apple-touch-icon" href="calosport-icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg: #12161B; --surface: #1B2128; --surface-2: #222A32;
    --text: #F2F0EA; --text-muted: #8A93A0; --line: #2A323B;
    --lime: #D4F252; --lime-dim: #3A4420;
    --flame: #FF7A59; --flame-dim: #3D2620;
    --volt: #6FA8FF; --volt-dim: #202B3D;
  }
  *{ box-sizing:border-box; }
  /* ---------- mode clair ---------- */
  :root[data-theme="light"]{
    --bg: #EFF1EA; --surface: #FFFFFF; --surface-2: #F3F4EE;
    --text: #14181D; --text-muted: #667085; --line: #E1E3DC;
    --lime: #6F9A16; --lime-dim: #EAF3D2;
    --flame: #D9522E; --flame-dim: #FBE4DC;
    --volt: #2F63C7; --volt-dim: #E3EBFB;
  }
  html[data-theme="light"], html[data-theme="light"] body{ background: var(--bg); }
  html,body{ margin:0; padding:0; background:#0A0C0F; font-family:'Inter',sans-serif; color:var(--text); -webkit-font-smoothing:antialiased; }
  body{ display:flex; min-height:100vh; }

  /* ---------- sidebar ---------- */
  .sidebar{
    width: 264px; flex-shrink:0;
    background: var(--bg); border-right:1px solid var(--line);
    padding: 28px 18px; display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh;
  }
  .sidebar-brand{ display:flex; align-items:center; gap:12px; padding: 6px 10px 30px; }
  .brand-mark{
    width:38px; height:38px; border-radius:12px; background:var(--lime);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .brand-name{ font-family:'Unbounded'; font-weight:700; font-size:14.5px; line-height:1.25; }
  .brand-name span{ display:block; font-family:'Inter'; font-weight:600; font-size:11px; color:var(--text-muted); margin-top:2px; }

  .sidebar-nav{ display:flex; flex-direction:column; gap:4px; }
  .sidebar-link{
    display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:13px;
    color: var(--text-muted); text-decoration:none; font-weight:600; font-size:14px;
  }
  .sidebar-link .dot{ width:7px; height:7px; border-radius:50%; background: var(--text-muted); flex-shrink:0; }
  .sidebar-link.active{ background: var(--surface); color: var(--text); }
  .sidebar-link.home.active .dot{ background: var(--lime); box-shadow:0 0 6px rgba(212,242,82,0.6); }
  .sidebar-link.cal.active .dot{ background: var(--flame); box-shadow:0 0 6px rgba(255,122,89,0.6); }
  .sidebar-link.sport.active .dot{ background: var(--volt); box-shadow:0 0 6px rgba(111,168,255,0.6); }
  .sidebar-link.calendar.active .dot{ background: var(--volt); box-shadow:0 0 6px rgba(111,168,255,0.6); }
  .sidebar-link.friends.active .dot{ background: var(--flame); box-shadow:0 0 6px rgba(255,122,89,0.6); }
  .sidebar-link.leaderboard.active .dot{ background: var(--lime); box-shadow:0 0 6px rgba(212,242,82,0.6); }
  .sidebar-link.feed.active .dot{ background: var(--volt); box-shadow:0 0 6px rgba(111,168,255,0.6); }
  .sidebar-link.supplements.active .dot{ background: var(--flame); box-shadow:0 0 6px rgba(255,122,89,0.6); }
  .sidebar-link.settings{ margin-top:8px; padding-top:14px; border-top:1px solid var(--line); }
  .sidebar-link.library.active .dot, .sidebar-link.progress.active .dot{ background: var(--text); }

  .sidebar-footer{ margin-top:auto; padding-top:16px; border-top:1px solid var(--line); }
  .sidebar-logout{
    width:100%; display:flex; align-items:center; gap:10px; padding:11px 14px; border-radius:13px;
    background:none; border:none; color:var(--text-muted); font-family:'Inter'; font-weight:600; font-size:13px; cursor:pointer;
  }
  .sidebar-logout:hover{ background: var(--surface); color: var(--flame); }

  /* ---------- main ---------- */
  .main{ flex:1; padding: 48px 56px 100px; min-width:0; }
  .main-inner{ max-width: 680px; }
  .page-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:8px; }
  .page-title{ font-family:'Unbounded'; font-weight:700; font-size:32px; }
  .page-sub{ font-size:13.5px; color:var(--text-muted); margin-bottom:24px; }
  .add-btn{
    border:none; background: var(--lime); color:#12161B; font-family:'Inter'; font-weight:700;
    font-size:13px; padding:11px 18px; border-radius:13px; cursor:pointer; white-space:nowrap;
  }

  .section-title{
    font-size:12px; font-weight:700; color: var(--text-muted); text-transform:uppercase;
    letter-spacing:0.05em; margin:26px 0 10px;
  }
  .card-list{ background: var(--surface); border:1px solid var(--line); border-radius:20px; overflow:hidden; }

  /* ---------- tableau de prise du jour ---------- */
  .time-group{ border-bottom:1px solid var(--line); }
  .time-group:last-child{ border-bottom:none; }
  .time-label{
    font-family:'Unbounded'; font-weight:700; font-size:12.5px; color: var(--volt);
    padding:12px 18px 4px;
  }
  .dose-row{ display:flex; align-items:center; gap:14px; padding:10px 18px 10px 18px; }
  .dose-check{
    width:24px; height:24px; border-radius:8px; border:2px solid var(--line); flex-shrink:0; cursor:pointer;
    display:flex; align-items:center; justify-content:center; color:#12161B; font-size:13px;
  }
  .dose-check.done{ background: var(--lime); border-color: var(--lime); }
  .dose-body{ flex:1; min-width:0; }
  .dose-name{ font-weight:700; font-size:13.5px; }
  .dose-name.done{ color: var(--text-muted); text-decoration:line-through; }
  .dose-dosage{ font-size:11.5px; color: var(--text-muted); margin-top:1px; }

  /* ---------- liste des compléments définis ---------- */
  .supp-row{ display:flex; align-items:center; gap:14px; padding:14px 18px; border-bottom:1px solid var(--line); }
  .supp-row:last-child{ border-bottom:none; }
  .supp-icon{
    width:38px; height:38px; border-radius:12px; background: var(--flame-dim); color: var(--flame);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:17px;
  }
  .supp-body{ flex:1; min-width:0; }
  .supp-name{ font-weight:700; font-size:13.5px; }
  .supp-meta{ font-size:11.5px; color: var(--text-muted); margin-top:2px; }
  .supp-actions{ display:flex; gap:8px; flex-shrink:0; }
  .icon-btn{
    width:32px; height:32px; border-radius:10px; border:1px solid var(--line); background: var(--surface-2);
    color: var(--text-muted); display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .icon-btn:hover{ color: var(--text); }
  .icon-btn.danger:hover{ color: var(--flame); border-color: var(--flame); }

  .empty-state{ text-align:center; padding:30px 16px; color: var(--text-muted); font-size:12.5px; }

  /* ---------- modale ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(6,8,10,0.75);
    display:none; align-items:center; justify-content:center; z-index:60; padding:24px;
  }
  .modal-overlay.open{ display:flex; }
  .modal-sheet{
    width:100%; max-width:440px; background: var(--bg); border:1px solid var(--line);
    border-radius:22px; padding:24px; max-height:82vh; overflow-y:auto;
  }
  .modal-title{ font-family:'Unbounded'; font-weight:700; font-size:16px; margin-bottom:16px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:11.5px; color:var(--text-muted); margin-bottom:7px; font-weight:600; }
  .field input, .field textarea{
    width:100%; background: var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:11px 13px; font-size:13.5px; color:var(--text); font-family:'Inter';
  }
  .field input:focus, .field textarea:focus{ outline:none; border-color: var(--lime); }
  .times-list{ display:flex; flex-direction:column; gap:8px; }
  .time-row{ display:flex; gap:8px; align-items:center; }
  .time-row input{ flex:1; }
  .time-remove{
    width:36px; height:36px; border-radius:10px; border:1px solid var(--line); background: var(--surface-2);
    color: var(--flame); cursor:pointer; flex-shrink:0;
  }
  .add-time-link{ font-size:12px; color: var(--volt); font-weight:700; cursor:pointer; margin-top:8px; display:inline-block; }
  .modal-actions{ display:flex; gap:10px; margin-top:18px; }
  .modal-btn{ flex:1; border:none; border-radius:14px; padding:12px; font-weight:700; font-size:13px; font-family:'Inter'; cursor:pointer; }
  .modal-btn.cancel{ background: var(--surface); color: var(--text-muted); border:1px solid var(--line); }
  .modal-btn.confirm{ background: var(--lime); color:#12161B; }
  .modal-msg{ font-size:12px; margin-top:10px; color: var(--flame); text-align:center; }
</style>
</head>

<div class="main">
  <div class="main-inner">

      <div class="page-title">Compléments</div>
      <button class="add-btn" onclick="openAddModal()">+ Ajouter</button>

    <div class="section-title">Aujourd'hui</div>
    <div class="card-list" id="today-list">
      <div class="empty-state">Chargement…</div>
    </div>

    <div class="section-title">Mes compléments</div>
    <div class="card-list" id="supp-list">
      <div class="empty-state">Chargement…</div>
    </div>

<!-- ===== Modale ajout / edition ===== -->
<div class="modal-overlay" id="supp-overlay">
  <div class="modal-sheet">
    <div class="modal-title" id="supp-modal-title">Ajouter un complément</div>
    <input type="hidden" id="supp-id">
    <div class="field">
      <label>Nom</label>
      <input type="text" id="supp-name" placeholder="Ex. Créatine">
    </div>
    <div class="field">
      <label>Dosage (optionnel)</label>
      <input type="text" id="supp-dosage" placeholder="Ex. 5g, 2 gélules…">
    </div>
    <div class="field">
      <label>Horaires de prise</label>
      <div class="times-list" id="times-list"></div>
      <span class="add-time-link" onclick="addTimeRow()">+ Ajouter un horaire</span>
    </div>
    <div class="field">
      <label>Notes (optionnel)</label>
      <textarea id="supp-notes" rows="2" placeholder="Ex. à prendre avec un repas"></textarea>
    </div>
    <div class="modal-actions">
      <button type="button" class="modal-btn cancel" onclick="closeModal('supp-overlay')">Annuler</button>
      <button type="button" class="modal-btn confirm" onclick="saveSupplement()">Enregistrer</button>
    </div>
    <div class="modal-msg" id="supp-msg"></div>
  </div>
</div>

<script src="config.js"></script>
<script src="auth-guard.js"></script>
<script>
  let SUPPLEMENTS = [];
  let TODAY_LOGS = new Set(); // clés "supplementId|time" déjà prises aujourd'hui
  const todayStr = new Date().toISOString().slice(0, 10);

  function closeModal(id){ document.getElementById(id).classList.remove("open"); }
  function openModal(id){ document.getElementById(id).classList.add("open"); }
  function escapeHtml(str){
    const d = document.createElement("div");
    d.textContent = str;
    return d.innerHTML;
  }

  // ---------- modale ajout/edition ----------
  function addTimeRow(value){
    const list = document.getElementById("times-list");
    const row = document.createElement("div");
    row.className = "time-row";
    row.innerHTML = `<input type="time" value="${value || "08:00"}"><button type="button" class="time-remove" onclick="this.parentElement.remove()">✕</button>`;
    list.appendChild(row);
  }

  function openAddModal(){
    document.getElementById("supp-modal-title").textContent = "Ajouter un complément";
    document.getElementById("supp-id").value = "";
    document.getElementById("supp-name").value = "";
    document.getElementById("supp-dosage").value = "";
    document.getElementById("supp-notes").value = "";
    document.getElementById("times-list").innerHTML = "";
    document.getElementById("supp-msg").textContent = "";
    addTimeRow("08:00");
    openModal("supp-overlay");
  }

  function openEditModal(id){
    const s = SUPPLEMENTS.find(x => x.id === id);
    if (!s) return;
    document.getElementById("supp-modal-title").textContent = "Modifier le complément";
    document.getElementById("supp-id").value = s.id;
    document.getElementById("supp-name").value = s.name;
    document.getElementById("supp-dosage").value = s.dosage || "";
    document.getElementById("supp-notes").value = s.notes || "";
    document.getElementById("times-list").innerHTML = "";
    (s.times && s.times.length ? s.times : ["08:00"]).forEach(t => addTimeRow(t));
    document.getElementById("supp-msg").textContent = "";
    openModal("supp-overlay");
  }

  async function saveSupplement(){
    const id = document.getElementById("supp-id").value;
    const name = document.getElementById("supp-name").value.trim();
    const dosage = document.getElementById("supp-dosage").value.trim();
    const notes = document.getElementById("supp-notes").value.trim();
    const times = [...document.querySelectorAll("#times-list input[type=time]")].map(i => i.value).filter(Boolean).sort();
    const msg = document.getElementById("supp-msg");

    if (!name){ msg.textContent = "Donne un nom à ton complément."; return; }
    if (!times.length){ msg.textContent = "Ajoute au moins un horaire."; return; }

    const payload = { user_id: currentUser.id, name, dosage: dosage || null, notes: notes || null, times, active: true };
    const { error } = id
      ? await supabaseClient.from("user_supplements").update(payload).eq("id", id)
      : await supabaseClient.from("user_supplements").insert(payload);

    if (error){ msg.textContent = "Erreur : " + error.message; return; }
    closeModal("supp-overlay");
    await loadAll();
  }

  async function deleteSupplement(id){
    if (!confirm("Supprimer ce complément et son historique de prise ?")) return;
    const { error } = await supabaseClient.from("user_supplements").delete().eq("id", id);
    if (error){ alert("Erreur : " + error.message); return; }
    await loadAll();
  }

  // ---------- tableau de prise du jour ----------
  async function toggleDose(supplementId, time){
    const key = `${supplementId}|${time}`;
    if (TODAY_LOGS.has(key)){
      await supabaseClient.from("supplement_logs").delete()
        .eq("supplement_id", supplementId).eq("log_date", todayStr).eq("scheduled_time", time);
      TODAY_LOGS.delete(key);
    } else {
      await supabaseClient.from("supplement_logs").insert({
        user_id: currentUser.id, supplement_id: supplementId, log_date: todayStr, scheduled_time: time
      });
      TODAY_LOGS.add(key);
    }
    renderToday();
  }

  function renderToday(){
    const el = document.getElementById("today-list");
    const active = SUPPLEMENTS.filter(s => s.active);
    if (!active.length){
      el.innerHTML = `<div class="empty-state">Ajoute un complément pour voir ton tableau de prise ici.</div>`;
      return;
    }

    const slots = [];
    active.forEach(s => (s.times || []).forEach(t => slots.push({ time: t, supplement: s })));
    slots.sort((a, b) => a.time.localeCompare(b.time));

    if (!slots.length){
      el.innerHTML = `<div class="empty-state">Aucun horaire défini.</div>`;
      return;
    }

    const byTime = {};
    slots.forEach(sl => { byTime[sl.time] = byTime[sl.time] || []; byTime[sl.time].push(sl.supplement); });

    el.innerHTML = Object.keys(byTime).sort().map(time => `
      <div class="time-group">
        <div class="time-label">${time}</div>
        ${byTime[time].map(s => {
          const done = TODAY_LOGS.has(`${s.id}|${time}`);
          return `
          <div class="dose-row">
            <div class="dose-check ${done ? "done" : ""}" onclick="toggleDose('${s.id}', '${time}')">${done ? "✓" : ""}</div>
            <div class="dose-body">
              <div class="dose-name ${done ? "done" : ""}">${escapeHtml(s.name)}</div>
              ${s.dosage ? `<div class="dose-dosage">${escapeHtml(s.dosage)}</div>` : ""}
            </div>
          </div>`;
        }).join("")}
      </div>`).join("");
  }

  function renderSuppList(){
    const el = document.getElementById("supp-list");
    if (!SUPPLEMENTS.length){
      el.innerHTML = `<div class="empty-state">Aucun complément enregistré pour l'instant.</div>`;
      return;
    }
    el.innerHTML = SUPPLEMENTS.map(s => `
      <div class="supp-row">
        <div class="supp-icon">💊</div>
        <div class="supp-body">
          <div class="supp-name">${escapeHtml(s.name)}${s.dosage ? " · " + escapeHtml(s.dosage) : ""}</div>
          <div class="supp-meta">${(s.times || []).join(" · ")}${s.notes ? " — " + escapeHtml(s.notes) : ""}</div>
        </div>
        <div class="supp-actions">
          <button class="icon-btn" onclick="openEditModal('${s.id}')" title="Modifier">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg>
          </button>
          <button class="icon-btn danger" onclick="deleteSupplement('${s.id}')" title="Supprimer">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>
          </button>
        </div>
      </div>`).join("");
  }

  async function loadAll(){
    const { data: supps } = await supabaseClient
      .from("user_supplements").select("*").eq("user_id", currentUser.id).order("name");
    SUPPLEMENTS = supps || [];

    const { data: logs } = await supabaseClient
      .from("supplement_logs").select("supplement_id, scheduled_time")
      .eq("user_id", currentUser.id).eq("log_date", todayStr);
    TODAY_LOGS = new Set((logs || []).map(l => `${l.supplement_id}|${l.scheduled_time}`));

    renderToday();
    renderSuppList();
  }

  (async function init(){
    const user = await requireAuth();
    if (!user) return;
    await loadAll();
  })();
</script>
</body>
</html>
